<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

<meta name="hosting-provider" content="Netlify">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Shop Hopper — Pacific Beach Prototype</title>

  <!-- Leaflet fallback map -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Font Awesome for icons similar to the real app -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />

  <style>
    :root {
      --teal: #2d4d59;
      --teal-dark: #233f49;
      --teal-deep: #18343d;
      --cyan: #13a5c5;
      --cyan-light: #dff5f9;

      --pink-bg: #fff9ff;
      --app-bg: #fbf5fb;
      --white: #ffffff;

      --text: #21272a;
      --muted: #7b8084;
      --line: #dedfe2;

      --green: #159a69;
      --green-bg: #dff5e9;

      --red: #e83c46;
      --red-bg: #ffe5e7;

      --blue: #2770ce;

      --shadow:
        0 2px 8px rgba(20, 40, 46, 0.08),
        0 8px 24px rgba(20, 40, 46, 0.06);

      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #151819;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    body.modal-open {
      overflow: hidden;
    }

    .prototype-shell {
      width: 100%;
      max-width: 1500px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--app-bg);
      position: relative;
      overflow: hidden;
    }

    /* ============================================================
       DEMO-ONLY PERSONA BAR
       ============================================================ */

    .demo-bar {
      min-height: 52px;
      padding: 8px 18px;
      background: #11191a;
      color: white;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;

      position: relative;
      z-index: 500;
    }

    .demo-label {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .demo-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;
      background: #5be4a8;
      box-shadow: 0 0 10px #5be4a8;
    }

    .persona-select {
      width: min(100%, 390px);
      padding: 9px 12px;

      border: 1px solid #435357;
      border-radius: 9px;

      color: white;
      background: #273235;
      outline: none;
    }

    #app {
      min-height: calc(100vh - 52px);
    }

    /* ============================================================
       COMMON
       ============================================================ */

    .app-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;

      font-weight: 750;
    }

    .button-primary {
      color: white;
      background: var(--teal);
    }

    .button-secondary {
      color: var(--teal);
      background: #eef6f7;
      border: 1px solid #d1e0e3;
    }

    .button-blue {
      color: white;
      background: #286dc8;
    }

    .button-green {
      color: white;
      background: #148b79;
    }

    .button-danger {
      color: #c93139;
      background: var(--red-bg);
    }

    .small-button {
      padding: 7px 10px;
      font-size: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      border-radius: 999px;
      padding: 5px 9px;

      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }

    .pill-active {
      color: var(--green);
      background: var(--green-bg);
    }

    .pill-draft {
      color: #946400;
      background: #fff0c9;
    }

    .pill-featured {
      color: #255bc7;
      background: #e6edff;
    }

    .neighborhood-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      width: fit-content;
      margin-top: 6px;
      padding: 5px 9px;

      border-radius: 999px;

      color: #17494c;
      background: #e5f6f7;

      font-size: 11px;
      font-weight: 800;
    }

    .empty-state {
      min-height: 330px;

      display: grid;
      place-items: center;

      text-align: center;
      color: var(--text);
    }

    .empty-state-inner {
      padding: 25px;
    }

    .empty-state h3 {
      margin: 0 0 18px;
      font-size: 20px;
      font-weight: 500;
    }

    .refresh-button {
      border: 0;
      background: transparent;

      color: #168be7;
      font-size: 16px;
    }

    /* ============================================================
       SHOPPER BOTTOM NAV
       ============================================================ */

    .shopper-page {
      min-height: calc(100vh - 52px);
      padding-bottom: 63px;

      position: relative;
      background: var(--pink-bg);
    }

    .shopper-bottom-nav {
      height: 63px;

      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      background: var(--teal);

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;

      z-index: 100;
    }

    .shopper-nav-button {
      height: 63px;

      border: 0;
      background: transparent;
      color: white;

      display: grid;
      place-items: center;
    }

    .shopper-nav-icon {
      width: 40px;
      height: 40px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      font-size: 19px;
      color: white;
    }

    .shopper-nav-button.active .shopper-nav-icon {
      background: var(--cyan);
    }

    /* ============================================================
       SHOPPER HOME
       ============================================================ */

    .shopper-home-top {
      background: var(--teal);
      color: white;
    }

    .search-row {
      padding: 8px 4px 5px;

      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px;
      gap: 5px;
      align-items: center;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap > i {
      position: absolute;
      left: 14px;
      top: 50%;

      transform: translateY(-50%);

      color: #7d898d;
      font-size: 15px;

      pointer-events: none;
    }

    .shopper-search {
      width: 100%;
      height: 38px;

      border: 0;
      border-radius: 24px;

      padding: 0 15px 0 39px;

      color: #333;
      background: white;
      outline: none;

      font-size: 14px;
    }

    .filter-button {
      width: 44px;
      height: 38px;

      border: 0;
      border-radius: 8px;

      color: white;
      background: transparent;

      font-size: 21px;
    }

    .filter-button:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .category-row {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;

      padding: 7px 4px 4px;

      background: var(--teal);
    }

    .category-row::-webkit-scrollbar {
      display: none;
    }

    .category-button {
      flex: 0 0 74px;

      min-height: 72px;

      border: 0;
      border-bottom: 3px solid transparent;

      background: transparent;
      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;

      font-size: 10px;
      font-weight: 800;
      text-transform: lowercase;
    }

    .category-button i {
      font-size: 21px;
    }

    .category-button.active {
      border-bottom-color: var(--cyan);
    }

    .shopper-home-body {
      min-height: 470px;
      padding: 18px 15px 28px;
      background: var(--pink-bg);
    }

    .home-results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 14px;
    }

    .home-results-header h2 {
      margin: 0;

      font-size: 18px;
      text-transform: uppercase;
    }

    .result-count {
      color: var(--muted);
      font-size: 12px;
    }

    .product-grid {
      width: 100%;
      max-width: 920px;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .product-card {
      overflow: hidden;

      border: 1px solid #e5e4e7;
      border-radius: 14px;

      background: white;
      box-shadow: 0 5px 18px rgba(20, 40, 46, 0.07);

      text-align: left;
      padding: 0;
    }

    .product-image-wrap {
      position: relative;
      aspect-ratio: 4 / 3;

      overflow: hidden;
      background: #e5e6e6;
    }

    .product-image {
      width: 100%;
      height: 100%;

      object-fit: cover;
      display: block;
    }

    .featured-badge {
      position: absolute;
      left: 9px;
      top: 9px;

      padding: 5px 8px;
      border-radius: 999px;

      color: white;
      background: rgba(34, 61, 68, 0.94);

      font-size: 10px;
      font-weight: 900;
    }

    .product-info {
      padding: 11px 12px 12px;
    }

    .product-title {
      margin-bottom: 4px;

      font-size: 14px;
      font-weight: 850;
      line-height: 1.25;
    }

    .product-price {
      margin-bottom: 8px;

      color: #075966;
      font-size: 17px;
      font-weight: 900;
    }

    .product-store,
    .product-distance {
      color: #6c7376;
      font-size: 11px;
    }

    .product-distance {
      margin-top: 5px;
    }

    /* ============================================================
       SHOPPER MESSAGES
       ============================================================ */

    .messages-view {
      min-height: calc(100vh - 115px);

      background: var(--teal);
      color: white;

      display: grid;
      place-items: center;
    }

    .messages-view strong {
      font-size: 16px;
    }

    /* ============================================================
       SHOPPER MARKETPLACES
       ============================================================ */

    .marketplaces-page {
      background: white;
    }

    .marketplaces-header {
      height: 58px;

      background: var(--teal);
      color: white;

      display: grid;
      grid-template-columns: 55px 1fr 55px;
      align-items: center;
    }

    .marketplaces-title {
      text-align: center;

      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    .marketplace-back {
      height: 58px;

      border: 0;
      background: transparent;
      color: white;

      font-size: 22px;
    }

    .market-map-wrap {
      position: relative;
      height: 405px;

      overflow: hidden;
      background: #d9e4e5;
    }

    #marketplaceMap {
      width: 100%;
      height: 100%;
    }

    .map-instruction {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;

      margin: 0 2px;
      padding: 14px 18px;

      border-radius: 14px;

      color: #515a5d;
      background: rgba(255, 255, 255, 0.94);

      font-size: 13px;

      z-index: 400;
    }

    .marketplace-strip {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;

      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;

      padding: 0 0 0 0;

      z-index: 400;
    }

    .marketplace-strip::-webkit-scrollbar {
      display: none;
    }

    .marketplace-card {
      flex: 0 0 160px;

      min-height: 88px;

      padding: 15px 12px;

      border: 1px solid #e0e3e4;
      border-radius: 14px;

      background: white;
      color: #282e30;

      text-align: left;
    }

    .marketplace-card strong {
      display: block;
      margin-bottom: 8px;

      font-size: 14px;
    }

    .marketplace-card span {
      color: #858a8c;
      font-size: 11px;
    }

    .marketplace-card.selected {
      color: white;
      background: var(--teal);
      border-color: var(--teal);
    }

    .marketplace-card.selected span {
      color: rgba(255, 255, 255, 0.72);
    }

    .marketplace-detail {
      padding: 17px 4px 19px;

      background: white;
    }

    .marketplace-detail h2 {
      margin: 0 0 7px;

      color: var(--teal);
      font-size: 20px;
      text-transform: uppercase;
    }

    .marketplace-detail p {
      margin: 0 0 16px;

      color: #8a8e91;
      font-size: 13px;
    }

    .shop-marketplace-button {
      width: 100%;
      min-height: 52px;

      border: 0;
      border-radius: 13px;

      background: var(--teal);
      color: white;

      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.03em;
    }

    /* ============================================================
       PROFILE
       ============================================================ */

    .profile-page {
      min-height: calc(100vh - 115px);

      background: var(--pink-bg);
    }

    .profile-header {
      height: 78px;

      position: relative;

      display: grid;
      place-items: center;

      color: white;
      background: #fff8ff;

      font-size: 22px;
      font-weight: 850;
      letter-spacing: 0.04em;

      text-shadow: 0 1px 2px rgba(150, 140, 150, 0.28);
    }

    .profile-back {
      position: absolute;
      left: 5px;

      border: 0;
      background: transparent;
      color: white;

      font-size: 22px;
    }

    .profile-section {
      margin: 0 4px 26px;
    }

    .profile-user-card {
      min-height: 124px;

      padding: 22px;

      background: #fcf8ff;

      display: flex;
      align-items: center;
      gap: 22px;
    }

    .profile-avatar {
      width: 72px;
      height: 72px;

      flex: 0 0 72px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background: var(--teal);
      color: white;

      font-size: 24px;
      font-weight: 700;
    }

    .profile-user-card h2 {
      margin: 0 0 5px;
      font-size: 21px;
    }

    .profile-user-card p {
      margin: 0 0 7px;
      color: #808487;
    }

    .business-badge {
      display: inline-block;

      padding: 5px 9px;
      border-radius: 8px;

      background: #e5e5ec;

      color: #30404a;

      font-size: 11px;
      font-weight: 700;
    }

    .merchant-center {
      margin: 0 4px 28px;
      padding: 18px;

      border: 1px solid #cbd0d3;
      border-radius: 15px;

      background: #fcf9ff;
    }

    .merchant-center-heading {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 11px;

      font-size: 18px;
      font-weight: 800;
    }

    .merchant-center-heading i {
      color: var(--teal);
    }

    .merchant-center p {
      margin: 0 0 15px;

      color: #777c80;
      font-size: 13px;
    }

    .merchant-center-button {
      width: 100%;
      height: 50px;

      border: 0;
      border-radius: 10px;

      background: var(--teal);
      color: white;

      font-weight: 850;
    }

    .profile-list-heading {
      margin: 0 0 10px;

      display: flex;
      justify-content: space-between;

      font-size: 15px;
      letter-spacing: 0.03em;
    }

    .profile-list-heading span:last-child {
      color: #85898b;
      font-size: 11px;
      font-weight: 400;
    }

    .favorite-row {
      display: flex;
      gap: 8px;
      overflow: hidden;
    }

    .favorite-row img {
      width: 220px;
      height: 120px;

      object-fit: cover;
    }

    .followed-stores {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .followed-store-chip {
      padding: 8px 11px;

      border-radius: 999px;

      color: var(--teal);
      background: #edf4f5;

      font-size: 11px;
      font-weight: 700;
    }

    /* ============================================================
       MERCHANT PORTAL
       ============================================================ */

    .merchant-page {
      min-height: calc(100vh - 52px);

      background: #f5f4f6;
    }

    .merchant-header {
      height: 72px;

      background: var(--teal);
      color: white;

      display: grid;
      grid-template-columns: 58px 1fr 58px;
      align-items: center;
    }

    .merchant-header-title {
      text-align: center;

      font-size: 22px;
      font-weight: 850;
      letter-spacing: 0.08em;
    }

    .merchant-header-button {
      height: 72px;

      border: 0;
      background: transparent;
      color: white;

      font-size: 21px;
    }

    .merchant-content {
      padding: 14px 5px 35px;
    }

    .merchant-store-switcher {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;

      margin-bottom: 12px;
    }

    .merchant-store-select {
      flex: 1;
      min-width: 220px;

      height: 42px;

      border: 1px solid #cbd2d4;
      border-radius: 10px;

      padding: 0 11px;

      background: white;
      color: #263034;
    }

    .merchant-store-card {
      padding: 16px;

      display: grid;
      grid-template-columns: 82px 1fr auto;
      gap: 14px;
      align-items: start;
    }

    .merchant-store-logo {
      width: 82px;
      height: 82px;

      border-radius: 12px;

      object-fit: cover;
      background: #dbe3e4;
    }

    .merchant-store-info h2 {
      margin: 0 0 7px;

      color: var(--teal);
      font-size: 18px;
    }

    .merchant-store-info p {
      margin: 0 0 8px;

      color: #7c8285;
      font-size: 13px;
      line-height: 1.45;
    }

    .merchant-store-address {
      color: #9a9ea0 !important;
      font-size: 11px !important;
    }

    .merchant-store-actions {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-edit {
      border: 0;
      background: transparent;
      color: #1c95ee;

      font-size: 18px;
    }

    .usage-card {
      margin-top: 16px;
      padding: 17px;
    }

    .usage-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 14px;
    }

    .usage-heading strong {
      color: var(--teal);
      font-size: 15px;
    }

    .plan-badge {
      padding: 5px 8px;
      border-radius: 7px;

      color: white;
      background: var(--teal);

      font-size: 11px;
      font-weight: 800;
    }

    .usage-row {
      display: flex;
      justify-content: space-between;

      color: #667074;
      font-size: 12px;
    }

    .usage-progress {
      height: 8px;
      margin-top: 10px;

      overflow: hidden;
      border-radius: 999px;

      background: #e6e7e8;
    }

    .usage-progress > div {
      height: 100%;

      border-radius: inherit;
      background: #2bddd3;
    }

    .merchant-action-grid {
      margin-top: 18px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .merchant-action {
      min-height: 90px;

      border: 0;
      border-radius: 10px;

      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;

      font-size: 13px;
      font-weight: 800;
    }

    .merchant-action i {
      font-size: 22px;
    }

    .merchant-action.add {
      background: var(--teal);
    }

    .merchant-action.bulk {
      background: #286dcc;
    }

    .merchant-action.preview {
      background: #148a79;
    }

    .inventory-tabs {
      margin-top: 20px;

      display: grid;
      grid-template-columns: 1fr 1fr;

      border-bottom: 1px solid #d3d6d8;
    }

    .inventory-tab {
      min-height: 54px;

      border: 0;
      border-bottom: 3px solid transparent;

      background: transparent;
      color: #8a8f92;

      font-weight: 700;
    }

    .inventory-tab.active {
      border-bottom-color: #29ddd1;
      color: var(--teal);
    }

    .inventory-list {
      display: grid;
      gap: 10px;

      margin-top: 13px;
    }

    .inventory-row {
      min-height: 88px;

      padding: 10px;

      display: grid;
      grid-template-columns: 65px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;

      background: #fffaff;
      border: 1px solid #ebe6ec;
      border-radius: 12px;
    }

    .inventory-image {
      width: 65px;
      height: 65px;

      object-fit: cover;

      border-radius: 9px;
      background: #e3e5e5;
    }

    .inventory-main strong {
      display: block;
      margin-bottom: 4px;

      font-size: 14px;
    }

    .inventory-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;

      color: #6d7477;
      font-size: 11px;
    }

    .inventory-actions {
      display: flex;
      gap: 6px;
    }

    .inventory-action {
      width: 36px;
      height: 36px;

      border: 0;
      border-radius: 8px;

    function loadState() {
      try {
        const raw =
          localStorage.getItem(STORAGE_KEY);

        if (!raw) {
          return createSeedData();
        }

        const parsed =
          JSON.parse(raw);

        if (
          !Array.isArray(parsed.merchants) ||
          !Array.isArray(parsed.stores) ||
          !Array.isArray(parsed.items)
        ) {
          return createSeedData();
        }

        return parsed;
      } catch (error) {
        console.warn(
          "Could not load prototype data.",
          error
        );

        return createSeedData();
      }
    }

    function saveState() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)

    function uid(prefix) {
      if (crypto?.randomUUID) {
        return `${prefix}-${crypto.randomUUID()}`;
      }

      return `${prefix}-${Date.now()}-${Math.random()
        .toString(36)
        .slice(2)}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeCategory(value) {
      return String(value ?? "")
        .trim()
        .toLowerCase();
    }

    function titleCase(value) {
      return String(value ?? "")
        .split(/[\s-]+/)
        .filter(Boolean)
        .map(
          word =>
            word[0].toUpperCase() +
            word.slice(1)
        )
        .join(" ");
    }

    function money(cents) {
      return new Intl.NumberFormat(
        "en-US",
        {
          style: "currency",
          currency: "USD"
        }
      ).format(
        Number(cents || 0) / 100
      );
    }

    function safeUrl(value) {
      try {
        const url =
          new URL(String(value));

        if (
          url.protocol === "https:" ||
          url.protocol === "http:"
        ) {
          return url.href;
        }
      } catch {
        // use placeholder
      }

      return PRODUCT_PLACEHOLDER;
    }

    function haversineMiles(
      lat1,
      lng1,
      lat2,
      lng2
    ) {
      const earthRadius =
        3958.8;

      const toRad =
        value =>
          value *
          Math.PI /
          180;

      const dLat =
        toRad(lat2 - lat1);

      const dLng =
        toRad(lng2 - lng1);

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) *
          Math.cos(toRad(lat2)) *
          Math.sin(dLng / 2) ** 2;

      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );

      return earthRadius * c;
    }

    function distanceLabel(distance) {
      const miles =
        Number(distance);

      if (!Number.isFinite(miles)) {
        return "";
      }

      if (miles < 0.1) {
        return "< 0.1 mi";
      }

      return `${miles.toFixed(1)} mi`;
    }

    function getMerchant(id) {
      return state.merchants.find(
        merchant =>
          merchant.id === id
      );
    }

    function getStore(id) {
      return state.stores.find(
        store =>
          store.id === id
      );
    }

    function getItem(id) {
      return state.items.find(
        item =>
          item.id === id
      );
    }

    function getMerchantStores(
      merchantId
    ) {
      return state.stores.filter(
        store =>
          store.merchantId ===
          merchantId
      );
    }

    function getStoreItems(storeId) {
      return state.items.filter(
        item =>
          item.storeId === storeId

    function selectedMerchant() {

    function selectedMarketplace() {

    function selectedShoppingMarketplace() {

    function getStoreDistance(store) {
      return haversineMiles(
        state.userLocation.lat,
        state.userLocation.lng,
        Number(store.lat),
        Number(store.lng)
      );
    }

    function marketplaceDistance(
      marketplace
    ) {
      return haversineMiles(
        state.userLocation.lat,
        state.userLocation.lng,
        marketplace.lat,
        marketplace.lng
      );
    }

      modalBackdrop.classList.remove(

    function getVisibleShopperItems() {
      const search =
        ui.search
          .trim()
          .toLowerCase();

      return state.items
        .map(
          item => {
            const store =
              getStore(
                item.storeId
              );

            if (!store) {
              return null;
            }

            const merchant =
              getMerchant(
                store.merchantId
              );

            if (!merchant) {
              return null;
            }

            return {
              item,
              store,
              merchant,
              distance:
                getStoreDistance(
                  store
                )
            };
          }
        )
        .filter(Boolean)
        .filter(
          result => {
            if (
              !result.store.published
            ) {
              return false;
            }

            if (
              !result.item.active
            ) {
              return false;
            }

            if (
              result.store.marketplaceSlug !==
              ui.marketplaceSlug
            ) {
              return false;
            }

            if (
              result.distance >
              ui.radiusMiles
            ) {
              return false;
            }

            if (
              ui.category !== "all" &&
              normalizeCategory(
                result.item.category
              ) !== ui.category
            ) {
              return false;
            }

            if (search) {
              const haystack = [
                result.item.title,
                result.item.description,
                result.item.category,
                result.store.name,
                result.merchant.businessName
              ]
                .join(" ")
                .toLowerCase();

              if (
                !haystack.includes(
                  search
                )
              ) {
                return false;
              }
            }

            return true;
          }
        )
        .sort(
          (a, b) => {
            if (
              a.item.featured !==
              b.item.featured
            ) {
              return a.item.featured
                ? -1
                : 1;
            }

            return (
              a.distance -
              b.distance
            );
          }
        );
    }

    async function loadGoogleMaps() {
      if (
        !GOOGLE_MAPS_API_KEY
      ) {
        return false;
      }

      if (
        window.google?.maps
      ) {
        return true;
      }

      if (
        googleMapsPromise
      ) {
        return googleMapsPromise;
      }

      googleMapsPromise =
        new Promise(
          (resolve, reject) => {
            const callbackName =
              `shopHopperGoogleMaps_${Date.now()}`;

            window[callbackName] =
              () => {
                delete window[
                  callbackName
                ];

                resolve(true);
              };

            const script =
              document.createElement(
                "script"
              );

            script.src =
              "https://maps.googleapis.com/maps/api/js" +
              `?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY)}` +
              `&callback=${callbackName}`;

            script.async =
              true;

            script.defer =
              true;

            script.onerror =
              () => {
                delete window[
                  callbackName
                ];

                reject(
                  new Error(
                    "Google Maps failed to load"
                  )
                );
              };

            document.head.appendChild(
              script
            );
          }
        );

      try {
        await googleMapsPromise;
        return true;
      } catch {
        return false;
      }
    }

    async function initializeMarketplaceMap() {
      const mapElement =
        document.getElementById(
          "marketplaceMap"
        );

      if (
        !mapElement
      ) {
        return;
      }

      const marketplace =
        selectedMarketplace();

      const googleAvailable =
        await loadGoogleMaps();

      if (
        !document.getElementById(
          "marketplaceMap"
        )
      ) {
        return;
      }

      if (
        googleAvailable &&
        window.google?.maps
      ) {
        initializeGoogleMap(
          mapElement,
          marketplace
        );

        return;
      }

      initializeLeafletMap(
        mapElement,
        marketplace
      );
    }

    function initializeGoogleMap(
      mapElement,
      marketplace
    ) {
      disposeMap();

      activeMapEngine =
        "google";

      activeMap =
        new google.maps.Map(
          mapElement,
          {
            center: {
              lat:
                marketplace.lat,

              lng:
                marketplace.lng
            },

            zoom:
              12.5,

            mapTypeControl:
              false,

            streetViewControl:
              false,

            fullscreenControl:
              false
          }
        );

      const marker =
        new google.maps.Marker({
          map:
            activeMap,

          position: {
            lat:
              marketplace.lat,

            lng:
              marketplace.lng
          },

          title:
            marketplace.name
        });

      activeMap.addListener(
        "click",
        event => {
          const lat =
            event.latLng.lat();

          const lng =
            event.latLng.lng();

          selectNearestMarketplace(
            lat,
            lng
          );
        }
      );
    }

    function initializeLeafletMap(
      mapElement,
      marketplace
    ) {
      disposeMap();

      if (
        !window.L
      ) {
        mapElement.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-inner">
              Map unavailable.
            </div>
          </div>
        `;

        return;
      }

      activeMapEngine =
        "leaflet";

      activeMap =
  L.map(
    mapElement,
    {
      zoomControl: true,
      zoomSnap: 0.5
    }
  ).setView(
    [
      marketplace.lat,
      marketplace.lng
    ],
    12.5
  );

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom:
            19,

          attribution:
            "&copy; OpenStreetMap contributors"
        }
      ).addTo(
        activeMap
      );

      L.marker([
        marketplace.lat,
        marketplace.lng
      ])
        .addTo(
          activeMap
        )
        .bindPopup(
          escapeHtml(
            marketplace.name
          )
        );

      activeMap.on(
        "click",
        event => {
          selectNearestMarketplace(
            event.latlng.lat,
            event.latlng.lng
          );
        }
      );

      setTimeout(
        () => {
          activeMap?.invalidateSize();
        },
        80
      );

    function selectNearestMarketplace(
      lat,
      lng
    ) {
      const nearest =
        MARKETPLACES
          .map(
            marketplace => ({
              marketplace,

              distance:
                haversineMiles(
                  lat,
                  lng,
                  marketplace.lat,
                  marketplace.lng
                )
            })
          )
          .sort(
            (a, b) =>
              a.distance -
              b.distance
          )[0];

      if (
        nearest
      ) {
        ui.selectedMapMarketplace =
          nearest.marketplace.slug;

        renderMarketplaces();
      }
    }

          } else {
            state.items.push({
              id:
                uid("item"),

              storeId:
                store.id,

              ...values
            });
          }

          saveState();

          closeModal();

          renderAll();
        }
      });
    }

    function openBulkImport() {
      const store =
        getStore(
          ui.merchantStoreId
        );

      if (!store) {
        return;
      }

      openModal({
        title:
          "Bulk Import",

        submitLabel:
          "Import Items",

        body: `
          <div class="notice">
            One item per line:
            title, price, category, quantity
          </div>

          <div class="field">
            <label>
              CSV merchandise
            </label>

            <textarea
              name="csv"
              required
              style="min-height:220px"
              placeholder="Beach Hat,29.99,fashion,10
Surf Wax,4.99,seasonal,25"
            ></textarea>
          </div>
        `,

        onSubmit(form) {
          const raw =
            String(
              new FormData(
                form
              ).get("csv")
            );

          const lines =
            raw
              .split(/\r?\n/)
              .map(
                line =>
                  line.trim()
              )
              .filter(Boolean);

          let imported =
            0;

          lines.forEach(
            (
              line,
              index
            ) => {
              const parts =
                line
                  .split(",")
                  .map(
                    value =>
                      value.trim()
                  );

              if (
                parts.length <
                4
              ) {
                return;
              }

              const [
                title,
                price,
                category,
                qty
              ] =
                parts;

              const numericPrice =
                Number(price);

              const numericQty =
                Number(qty);

              if (
                !title ||
                !Number.isFinite(
                  numericPrice
                ) ||
                !Number.isFinite(
                  numericQty
                )
              ) {
                return;
              }

              state.items.push({
                id:
                  uid("item"),

                storeId:
                  store.id,

                title,

                description:
                  `${title} imported into the prototype catalog.`,

                category:
                  normalizeCategory(
                    category
                  ) ||
                  store.category,

                type:
                  numericQty === -1
                    ? "service"
                    : "product",

                priceCents:
                  Math.round(
                    numericPrice *
                    100
                  ),

                qty:
                  numericQty,

                image:
                  PRODUCT_PLACEHOLDER,

                featured:
                  false,

                active:
                  true
              });

              imported +=
                1;
            }
          );

          if (
            !imported
          ) {
            alert(
              "No valid rows were found."
            );

            return;
          }

          saveState();

          closeModal();

          renderAll();
        }
      });
    }

    // ============================================================
    // DETAIL / PREVIEW
    // ============================================================

    function openItemDetail(
      itemId
    ) {
      const item =
        getItem(
          itemId
        );

      if (!item) {
        return;
      }

      const store =
        getStore(
          item.storeId
        );

      if (!store) {
        return;
      }

      const distance =
        getStoreDistance(
          store
        );

      openModal({
        title:
          "Item Details",

        submitLabel:
          null,

        body: `
          <div class="detail-grid">

            <img
              src="${escapeHtml(safeUrl(item.image))}"
              alt="${escapeHtml(item.title)}"
            />

            <div>

              <h2>
                ${escapeHtml(item.title)}
              </h2>

              <div class="detail-price">
                ${money(item.priceCents)}
              </div>

              <p class="detail-copy">
                ${escapeHtml(item.description)}
              </p>

              <p class="detail-copy">
                <strong>
                  ${escapeHtml(store.name)}
                </strong>
                <br />
                ${escapeHtml(distanceLabel(distance))}
                ·
                ${escapeHtml(marketplaceLabel(store))}
              </p>

              <p class="detail-copy">
                ${escapeHtml(store.address)}
              </p>

            </div>

          </div>
        `
      });
    }

    function openStorePreview(
      storeId
    ) {
      const store =
        getStore(
          storeId
        );

      if (!store) {
        return;
      }

      const items =
        getStoreItems(
          store.id
        );

      openModal({
        title:
          "Store Preview",

        submitLabel:
          null,

        body: `
          <div class="notice">
            ${
              store.published
                ? "This store is currently published."
                : "This store is still a draft."
            }
          </div>

          <h2>
            ${escapeHtml(store.name)}
          </h2>

          <p class="detail-copy">
            ${escapeHtml(store.description)}
          </p>

          <p class="detail-copy">
            ${escapeHtml(store.address)}
          </p>

          <hr />

          ${items
            .map(
              item => `
                <p>
                  <strong>
                    ${escapeHtml(item.title)}
                  </strong>
                  —
                  ${money(item.priceCents)}
                </p>
              `
            )
            .join("")}
        `
      });
    }

    // ============================================================
    // EVENTS
    // ============================================================

    document.addEventListener(
      "input",
      event => {
        if (
          event.target.id ===
          "shopperSearch"
        ) {
          ui.search =
            event.target.value;

          renderShopperResults();
        }
      }
    );

    document.addEventListener(
      "change",
      event => {
        if (
          event.target.id ===
          "merchantStoreSelect"
        ) {
          ui.merchantStoreId =
            event.target.value;

          renderMerchant();
        }
      }
    );

    document.addEventListener(
      "click",
      event => {
        const button =
          event.target.closest(
            "[data-action]"
          );

        if (!button) {
          return;
        }

        const action =
          button.dataset.action;

        const id =
          button.dataset.id;

        switch (
          action
        ) {
          case "close-modal":
            closeModal();
            break;

          case "shopper-home":
            disposeMap();

            ui.persona =
              "shopper";

            ui.shopperView =
              "home";

            renderAll();
            break;

          case "shopper-messages":
            disposeMap();

            ui.shopperView =
              "messages";

            renderShopper();
            break;

          case "shopper-map":
            disposeMap();

            ui.shopperView =
              "map";

            ui.selectedMapMarketplace =
              ui.marketplaceSlug;

            renderShopper();
            break;

          case "shopper-profile":
            disposeMap();

            ui.shopperView =
              "profile";

            renderShopper();
            break;

          case "category":
            ui.category =
              button.dataset.category;

            renderShopperHome();
            break;

          case "shopper-filter":
            openModal({
              title:
                "Search Radius",

              submitLabel:
                "Apply",

              body: `
                <div class="field">
                  <label>
                    Show items within
                  </label>

                  <select
                    name="radius"
                  >
                    ${[3, 10, 25, 50]
                      .map(
                        radius => `
                          <option
                            value="${radius}"
                            ${
                              ui.radiusMiles === radius
                                ? "selected"
                                : ""
                            }
                          >
                            ${radius} miles
                          </option>
                        `
                      )
                      .join("")}
                  </select>
                </div>
              `,

              onSubmit(form) {
                ui.radiusMiles =
                  Number(
                    new FormData(
                      form
                    ).get(
                      "radius"
                    )
                  );

                closeModal();

                renderShopperHome();
              }
            });
            break;

          case "refresh-shopper":
            ui.search =
              "";

            ui.category =
              "all";

            renderShopperHome();
            break;

          case "select-marketplace":
            ui.selectedMapMarketplace =
              button.dataset.marketplace;

            renderMarketplaces();
            break;

          case "shop-selected-marketplace":
            ui.marketplaceSlug =
              ui.selectedMapMarketplace;

            ui.category =
              "all";

            ui.search =
              "";

            ui.shopperView =
              "home";

            renderAll();
            break;

          case "enter-merchant-portal":
            if (
              !ui.selectedMerchantId
            ) {
              ui.selectedMerchantId =
                state.merchants[0]?.id ||
                null;
            }

            ui.persona =
              "merchant";

            {
              const stores =
                getMerchantStores(
                  ui.selectedMerchantId
                );

              ui.merchantStoreId =
                stores[0]?.id ||
                null;
            }

            renderAll();
            break;

          case "merchant-exit":
            ui.persona =
              "shopper";

            ui.shopperView =
              "profile";

            renderAll();
            break;

          case "refresh-merchant":
            renderMerchant();
            break;

          case "view-merchant":
            ui.selectedMerchantId =
              id;

            ui.persona =
              "merchant";

            {
              const stores =
                getMerchantStores(
                  id
                );

              ui.merchantStoreId =
                stores[0]?.id ||
                null;
            }

            renderAll();
            break;

          case "add-merchant":
            openAddMerchant();
            break;

          case "add-store":
            openStoreForm();
            break;

          case "edit-store":
            openStoreForm(
              getStore(
                ui.merchantStoreId
              )
            );
            break;

          case "toggle-store-publish": {
            const store =
              getStore(
                ui.merchantStoreId
              );

            if (!store) {
              break;
            }

            if (
              !store.published &&
              !getStoreItems(
                store.id
              ).some(
                item =>
                  item.active
              )
            ) {
              alert(
                "Add at least one active item before publishing this store."
              );

              break;
            }

            store.published =
              !store.published;

            saveState();

            renderMerchant();
            break;
          }

          case "add-item":
            openItemForm();
            break;

          case "edit-item":
            openItemForm(
              getItem(id)
            );
            break;

          case "toggle-item": {
            const item =
              getItem(id);

            if (!item) {
              break;
            }

            item.active =
              !item.active;

            saveState();

            renderMerchant();
            break;
          }

          case "delete-item": {
            const item =
              getItem(id);

            if (!item) {
              break;
            }

            if (
              !confirm(
                `Delete "${item.title}"?`
              )
            ) {
              break;
            }

            state.items =
              state.items.filter(
                candidate =>
                  candidate.id !== id
              );

            saveState();

            renderMerchant();
            break;
          }

          case "bulk-import":
            openBulkImport();
            break;

          case "preview-store":
            openStorePreview(
              id
            );
            break;

          case "inventory-tab":
            ui.inventoryTab =
              button.dataset.tab;

            renderMerchant();
            break;

          case "view-item":
            openItemDetail(
              id
            );
            break;

          case "reset-demo":
            if (
              !confirm(
                "Reset all prototype merchants, stores and merchandise?"
              )
            ) {
              break;
            }

            state =
              createSeedData();

            saveState();

            ui.persona =
              "admin";

            ui.selectedMerchantId =
              state.merchants[0]?.id ||
              null;

            ui.merchantStoreId =
              null;

            ui.shopperView =
              "home";

            ui.marketplaceSlug =
              "pacific-beach";

            ui.selectedMapMarketplace =
              "pacific-beach";

            ui.category =
              "all";

            ui.search =
              "";

            ui.radiusMiles =
              3;

            renderAll();
            break;
        }
      }
    );

    // ============================================================
    // START
    // ============================================================

    renderAll();
  </script>

        const seedEntry
        of HOPPER_SURFER_SEED_ENTRIES
      ) {
        const existing =
          list.entries.find(
            entry =>
              entry.id ===
              seedEntry.id
          );

        if (!existing) {
          list.entries.push({
            ...seedEntry
          });

          continue;
        }

        if (
          !existing.merchantId &&
          seedEntry.merchantId
        ) {
          existing.merchantId =
            seedEntry.merchantId;
        }

        if (
          !existing.itemId &&
          seedEntry.itemId &&
          getItem(
            seedEntry.itemId
          )
        ) {
          existing.itemId =
            seedEntry.itemId;
        }

        if (
          !existing.suggestedCategory
        ) {
          existing.suggestedCategory =
            seedEntry.suggestedCategory;
        }
      }
    }

    async function geocodeStoreAddress(
      address,
      marketplaceSlug
    ) {
      const marketplace =
        MARKETPLACES.find(
          candidate =>
            candidate.slug ===
            marketplaceSlug
        );

      const hasCityOrState =
        /,|\b(?:CA|California)\b/i.test(
          address
        );

      const query =
        hasCityOrState
          ? address
          : [
              address,
              marketplace?.name,
              "San Diego County",
              "California"
            ]
              .filter(Boolean)
              .join(", ");

      const url =
        new URL(
          "https://nominatim.openstreetmap.org/search"
        );

      url.searchParams.set(
        "q",
        query
      );

      url.searchParams.set(
        "format",
        "jsonv2"
      );

      url.searchParams.set(
        "limit",
        "1"
      );

      url.searchParams.set(
        "countrycodes",
        "us"
      );

      const controller =
        new AbortController();

      const timeout =
        window.setTimeout(
          () =>
            controller.abort(),
          8000
        );

      try {
        const response =
          await fetch(
            url,
            {
              headers: {
                Accept:
                  "application/json"
              },

              signal:
                controller.signal
            }
          );

        if (!response.ok) {
          throw new Error(
            "Address lookup is unavailable."
          );
        }

        const results =
          await response.json();

        const match =
          results?.[0];

        const lat =
          Number(
            match?.lat
          );

        const lng =
          Number(
            match?.lon
          );

        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng)
        ) {
          return null;
        }

        return {
          lat,
          lng
        };
      } finally {
        window.clearTimeout(
          timeout
        );
      }
    }

        }

        renderMerchant();
      };

    /* ============================================================
       HOPPER BUTTON EVENTS
       ============================================================ */

    document.addEventListener(
      "click",
      event => {
        const button =
          event.target.closest(
            "[data-action]"
          );

        if (!button) {
          return;
        }

        const action =
          button.dataset.action;

        if (
          action ===
          "hopper-add-local-find"
        ) {
          openHopperLocalFindExtension();
          return;
        }

        if (
          action ===
          "hopper-add-entry"
        ) {
          const list =
            getExtensionHopperList(
              ui.selectedHopperId ||
              HOPPER_SURFER_EXTENSION.id
            );

          const entry =
            list?.entries.find(
              candidate =>
                candidate.id ===
                button.dataset.entryId
            );

          if (entry) {
            openHopperLocalFindExtension(
              entry
            );
          }

          return;
        }

        if (
          action ===
          "hopper-open-item"
        ) {
          const itemId =
            button.dataset.id;

          if (
            itemId
          ) {
            openItemDetail(
              itemId
            );
          }
        }
      }
    );

    /* ============================================================
       INITIALIZE HOPPER EXTENSION
       ============================================================ */

    ensureHopperStateExtension();

    saveState();

    renderAll();
  })();
</script>

<script>
  (() => {
    "use strict";

    /* ============================================================
       MAP INVENTORY
       ============================================================ */

    function getMapInventoryRecords(
      marketplaceSlug
    ) {
      return state.items
        .map(
          item => {
            const store =
              getStore(
                item.storeId
              );

            if (!store) {
              return null;
            }

            const merchant =
              getMerchant(
                store.merchantId
              );

            if (!merchant) {
              return null;
            }

            if (
              !store.published ||
              !item.active
            ) {
              return null;
            }

            if (
              store.marketplaceSlug !==
              marketplaceSlug
            ) {
              return null;
            }

            const lat =
              Number(
                store.lat
              );

            const lng =
              Number(
                store.lng
              );

            if (
              !Number.isFinite(lat) ||
              !Number.isFinite(lng)
            ) {
              return null;
            }

            return {
              item,
              store,
              merchant,
              lat,
              lng
            };
          }
        )
        .filter(Boolean);
    }

    /*
     * If a store contains several products, spread their
     * demo pins by only a few meters so each remains clickable.
     */
    function getMapMarkerPosition(
      record,
      records
    ) {
      const sameStore =
        records.filter(
          candidate =>
            candidate.store.id ===
            record.store.id
        );

      const index =
        sameStore.findIndex(
          candidate =>
            candidate.item.id ===
            record.item.id
        );

      if (
        index <= 0
      ) {
        return {
          lat:
            record.lat,

          lng:
            record.lng
        };
      }

      const angle =
        index *
        2.3999632297;

      const radius =
        0.00018 *
        Math.ceil(
          index / 5
        );

      return {
        lat:
          record.lat +
          Math.sin(angle) *
          radius,

        lng:
          record.lng +
          Math.cos(angle) *
          radius
      };
    }

    /* ============================================================
       MAP ITEM BANNER
       ============================================================ */

    function renderMapItemBanner() {
      const wrap =
        document.querySelector(
          ".market-map-wrap"
        );

      if (!wrap) {
        return;
      }

      let shell =
        wrap.querySelector(
          ".map-item-banner-shell"
        );

      if (!shell) {
        shell =
          document.createElement(
            "div"
          );

        shell.className =
          "map-item-banner-shell";

        wrap.appendChild(
          shell
        );
      }

      const marketplace =
        selectedMarketplace();

      const records =
        getMapInventoryRecords(
          marketplace.slug
        );

      if (
        !records.length
      ) {
        ui.selectedMapItemId =
          null;

        shell.innerHTML = `
          <div class="map-item-banner-empty">
            No Shop Hopper items have been added to
            ${escapeHtml(
              marketplace.name
            )}
            yet.
          </div>
        `;

        return;
      }

      let selected =
        records.find(
          record =>
            record.item.id ===
            ui.selectedMapItemId
        );

      if (!selected) {
        selected =
          records[0];

        ui.selectedMapItemId =
          selected.item.id;
      }

      const distance =
        getStoreDistance(
          selected.store
        );

      shell.innerHTML = `
        <div class="map-item-banner">

          <img
            class="map-item-banner-image"
            src="${escapeHtml(
              safeUrl(
                selected.item.image
              )
            )}"
            alt="${escapeHtml(
              selected.item.title
            )}"
          />

          <div class="map-item-banner-copy">

            <div class="map-item-banner-title">
              ${escapeHtml(
                selected.item.title
              )}
            </div>

            <div class="map-item-banner-store">
              ${escapeHtml(
                selected.store.name
              )}
            </div>

            <div class="map-item-banner-meta">
              ${money(
                selected.item.priceCents
              )}
              &nbsp;·&nbsp;
              ${escapeHtml(
                distanceLabel(
                  distance
                )
              )}
            </div>

          </div>

          <button
            type="button"
            class="map-item-banner-button"
            data-action="map-view-item"
            data-id="${escapeHtml(
              selected.item.id
            )}"
          >
            View
          </button>

        </div>
      `;
    }

    function selectMapItem(
      itemId
    ) {
      ui.selectedMapItemId =
        itemId;

      renderMapItemBanner();
    }

    /* ============================================================
       EXTEND MARKETPLACE RENDER
       ============================================================ */

    const originalRenderMarketplaces =
      renderMarketplaces;

    renderMarketplaces =
      function renderMarketplacesWithItems() {
        originalRenderMarketplaces();

        /*
         * Add the item banner after the existing Marketplace
         * screen has rendered.
         */
        renderMapItemBanner();
      };

    /* ============================================================
       LEAFLET ITEM MARKERS
       ============================================================ */

    const originalInitializeLeafletMap =
      initializeLeafletMap;

    initializeLeafletMap =
      function initializeLeafletMapWithItems(
        mapElement,
        marketplace
      ) {
        originalInitializeLeafletMap(
          mapElement,
          marketplace
        );

        if (
          !activeMap ||
          activeMapEngine !==
            "leaflet" ||
          !window.L
        ) {
          return;
        }

        const records =
          getMapInventoryRecords(
            marketplace.slug
          );

        records.forEach(
          record => {
            const position =
              getMapMarkerPosition(
                record,
                records
              );

            const icon =
              L.divIcon({
                className:
                  "",

                html: `
                  <div class="shop-map-item-marker">
                    <i class="fa-solid fa-bag-shopping"></i>
                  </div>
                `,

                iconSize:
                  [32, 32],

                iconAnchor:
                  [16, 16],

                popupAnchor:
                  [0, -18]
              });

            const marker =
              L.marker(
                [
                  position.lat,
                  position.lng
                ],
                {
                  icon
                }
              )
                .addTo(
                  activeMap
                );

            marker.bindTooltip(
              `
                <strong>
                  ${escapeHtml(
                    record.item.title
                  )}
                </strong>
                <br>
                ${escapeHtml(
                  record.store.name
                )}
              `,
              {
                direction:
                  "top"
              }
            );

            marker.on(
              "click",
              () => {
                selectMapItem(
                  record.item.id
                );
              }
            );
          }
        );

        renderMapItemBanner();
      };

    /* ============================================================
       GOOGLE MAP ITEM MARKERS
       ============================================================ */

    const originalInitializeGoogleMap =
      initializeGoogleMap;

    initializeGoogleMap =
      function initializeGoogleMapWithItems(
        mapElement,
        marketplace
      ) {
        originalInitializeGoogleMap(
          mapElement,
          marketplace
        );

        if (
          !activeMap ||
          activeMapEngine !==
            "google" ||
          !window.google?.maps
        ) {
          return;
        }

        const records =
          getMapInventoryRecords(
            marketplace.slug
          );

        records.forEach(
          (
            record,
            index
          ) => {
            const position =
              getMapMarkerPosition(
                record,
                records
              );

            const marker =
              new google.maps.Marker({
                map:
                  activeMap,

                position,

                title:
                  `${record.item.title} — ${record.store.name}`,

                label: {
                  text:
                    "●",

                  color:
                    "#13a5c5",

                  fontSize:
                    "22px",

                  fontWeight:
                    "900"
                },

                zIndex:
                  100 +
                  index
              });

            marker.addListener(
              "click",
              () => {
                selectMapItem(
                  record.item.id
                );
              }
            );
          }
        );

        renderMapItemBanner();
      };

    /* ============================================================
       VIEW ITEM FROM MAP BANNER
       ============================================================ */

    document.addEventListener(
      "click",
      event => {
        const button =
          event.target.closest(
            '[data-action="map-view-item"]'
          );

        if (!button) {
          return;
        }

        const itemId =
          button.dataset.id;

        if (itemId) {
          openItemDetail(
            itemId
          );
        }
      }
    );
  })();
</script>

      if (
        page.querySelector(

      page.insertAdjacentHTML(

        `

              type="button"

            >

                <i class="fa-solid fa-user"></i>
              </span>
            </button>

          </nav>
        `
      );
    }

    document.addEventListener(
      "click",
      event => {
        const button =
          event.target.closest(
            "[data-hopper-nav]"
          );

        if (!button) {
          return;
        }

        const action =
          button.dataset.hopperNav;

        if (
          action === "home"
        ) {
          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

          return;
        }

        if (
          action === "add"
        ) {
          document
            .querySelector(
              '[data-action="hopper-add-local-find"]'
            )
            ?.click();

          return;
        }

        if (
          action === "map"
        ) {
          ui.persona =
            "shopper";

          ui.shopperView =
            "map";

          ui.selectedMapMarketplace =
            ui.marketplaceSlug;

          renderAll();

          return;
        }

        if (
          action === "shopper"
        ) {
          ui.persona =
            "shopper";

          ui.shopperView =
            "home";

          renderAll();
        }
      }
    );

    const observer =
      new MutationObserver(
        () => {
          addHopperBottomNav();
        }
      );

    observer.observe(
      document.getElementById(
        "app"
      ),
      {
        childList: true,
        subtree: true
      }
    );

    addHopperBottomNav();
  })();
</script>

            )
        );

    if (!merchant) {
      merchant = {
        ...spec
      };

      targetState.merchants.push(
        merchant
      );

      return merchant;
    }

    merchant.businessName =
      spec.businessName;

    merchant.status =
      "active";

    if (
      !merchant.ownerName &&
      spec.ownerName
    ) {
      merchant.ownerName =
        spec.ownerName;

    if (
      !merchant.email &&
      spec.email

<script>
(() => {
  "use strict";

  /* ============================================================

     ============================================================ */

  const originalOpenItemDetailStoreMap =
    openItemDetail;

  openItemDetail =
    function openItemDetailWithStoreMap(
      itemId
    ) {
      originalOpenItemDetailStoreMap(
        itemId
      );

      const item =
        getItem(
          itemId
        );

      if (!item) {
        return;
      }

      const store =
        getStore(
          item.storeId
        );

      if (!store) {
        return;
      }

      const detailGrid =
        modalBody.querySelector(
          ".detail-grid"
        );

      if (!detailGrid) {
        return;
      }

      /*
       * Find the existing paragraph containing
       * the store name.
       */
      const storeStrong =
        Array.from(
          detailGrid.querySelectorAll(
            ".detail-copy strong"
          )
        ).find(
          element =>
            element.textContent
              .trim() ===
            store.name.trim()
        );

      if (!storeStrong) {
        return;
      }

      const storeParagraph =
        storeStrong.closest(
          ".detail-copy"
        );

      if (!storeParagraph) {
        return;
      }

      const distance =
        getStoreDistance(
          store
        );

      storeParagraph.innerHTML = `
        <button
          type="button"
          class="item-store-map-button"
          data-store-map="${escapeHtml(
            store.id
          )}"
          title="Show ${escapeHtml(
            store.name
          )} on the map"
        >
          <i class="fa-solid fa-location-dot"></i>

          <span>
            ${escapeHtml(
              store.name
            )}
          </span>

          <i
            class="fa-solid fa-chevron-right store-map-arrow"
          ></i>
        </button>

        <br />

        <span class="item-store-map-meta">
          ${escapeHtml(
            distanceLabel(
              distance
            )
          )}
          ·
          ${escapeHtml(
            marketplaceLabel(
              store
            )
          )}
        </span>
      `;
    };

  /* ============================================================
     CENTER MAP ON SELECTED STORE
     ============================================================ */

  function focusStoreOnMap(
    store
  ) {
    let attempts =
      0;

    const timer =
      setInterval(
        () => {
          attempts +=
            1;

          /*
           * Give the map renderer time to finish.
           */
          if (
            activeMap &&
            activeMapEngine
          ) {
            clearInterval(
              timer
            );

            const lat =
              Number(
                store.lat
              );

            const lng =
              Number(
                store.lng
              );

            if (
              !Number.isFinite(
                lat
              ) ||
              !Number.isFinite(
                lng
              )
            ) {
              return;
            }

            /* ----------------------------------------------
               LEAFLET / OPENSTREETMAP
               ---------------------------------------------- */

            if (
              activeMapEngine ===
                "leaflet" &&
              window.L
            ) {
              activeMap.setView(
                [
                  lat,
                  lng
                ],
                16
              );

              L.marker(
                [
                  lat,
                  lng
                ]
              )
                .addTo(
                  activeMap
                )
                .bindPopup(
                  `
                    <strong>
                      ${escapeHtml(
                        store.name
                      )}
                    </strong>
                    <br />
                    ${escapeHtml(
                      store.address
                    )}
                  `
                )
                .openPopup();

              setTimeout(
                () => {
                  activeMap
                    ?.invalidateSize();
                },
                100
              );

              return;
            }

            /* ----------------------------------------------
               GOOGLE MAPS
               ---------------------------------------------- */

            if (
              activeMapEngine ===
                "google" &&
              window.google?.maps
            ) {
              const position = {
                lat,
                lng
              };

              activeMap.setCenter(
                position
              );

              activeMap.setZoom(
                16
              );

              const marker =
                new google.maps.Marker({
                  map:
                    activeMap,

                  position,

                  title:
                    store.name
                });

              const infoWindow =
                new google.maps.InfoWindow({
                  content:
                    `
                      <div
                        style="
                          font-family:
                            Arial,
                            sans-serif;
                          min-width:160px;
                        "
                      >
                        <strong>
                          ${escapeHtml(
                            store.name
                          )}
                        </strong>

                        <br />

                        <span
                          style="
                            color:#666;
                            font-size:12px;
                          "
                        >
                          ${escapeHtml(
                            store.address
                          )}
                        </span>
                      </div>
                    `
                });

              infoWindow.open({
                map:
                  activeMap,

                anchor:
                  marker
              });
            }

            return;
          }

          /*
           * Stop checking after about 5 seconds
           * if the map could not load.
           */
          if (
            attempts >=
            50
          ) {
            clearInterval(
              timer
            );
          }
        },
        100
      );
  }

  /* ============================================================
     STORE CLICK
     ============================================================ */

  document.addEventListener(
    "click",
    event => {
      const button =
        event.target.closest(
          "[data-store-map]"
        );

      if (!button) {
        return;
      }

      const store =
        getStore(
          button.dataset.storeMap
        );

      if (!store) {
        return;
      }

      closeModal();

      disposeMap();

      /*
       * Switch to the Shopper map even if the
       * product was opened from a Hopper card.
       */
      ui.persona =
        "shopper";

      ui.shopperView =
        "map";

      ui.marketplaceSlug =
        store.marketplaceSlug ||
        "pacific-beach";

      ui.selectedMapMarketplace =
        store.marketplaceSlug ||
        "pacific-beach";

      renderAll();

      /*
       * After the marketplace map is created,
       * zoom directly to this store.
       */
      focusStoreOnMap(
        store
      );
    }
  );
})();
</script>
