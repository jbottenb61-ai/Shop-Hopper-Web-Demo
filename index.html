<script>
(() => {
  "use strict";

  /*
   * Prevent accidental duplicate installation if this
   * code block is ever pasted more than once.
   */
  if (
    window.__shopHopperDataToolsInstalled
  ) {
    return;
  }

  window.__shopHopperDataToolsInstalled =
    true;

  const DATA_EXPORT_VERSION =
    1;

  const PRE_IMPORT_BACKUP_KEY =
    `${STORAGE_KEY}-pre-import-backup`;

  /* ============================================================
     CREATE BUTTONS
     ============================================================ */

  function installDataTools() {
    const demoBar =
      document.querySelector(
        ".demo-bar"
      );

    if (!demoBar) {
      return;
    }

    if (
      document.getElementById(
        "demoDataTools"
      )
    ) {
      return;
    }

    demoBar.insertAdjacentHTML(
      "beforeend",
      `
        <div
          id="demoDataTools"
          class="demo-data-tools"
        >
          <button
            type="button"
            class="demo-data-button export"
            data-demo-data-action="export"
            title="Save all prototype data to a JSON backup file"
          >
            <i class="fa-solid fa-download"></i>
            &nbsp;
            Export Data
          </button>

          <button
            type="button"
            class="demo-data-button import"
            data-demo-data-action="import"
            title="Restore prototype data from a JSON backup"
          >
            <i class="fa-solid fa-upload"></i>
            &nbsp;
            Import Data
          </button>

          <input
            id="shopHopperImportFile"
            type="file"
            accept=".json,application/json"
            hidden
          />
        </div>
      `
    );
  }

  /* ============================================================
     EXPORT
     ============================================================ */

  function exportShopHopperData() {
    const exportPackage = {
      application:
        "Shop Hopper Prototype",

      version:
        DATA_EXPORT_VERSION,

      exportedAt:
        new Date().toISOString(),

      data:
        state
    };

    const json =
      JSON.stringify(
        exportPackage,
        null,
        2
      );

    const blob =
      new Blob(
        [json],
        {
          type:
            "application/json"
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    const now =
      new Date();

    const date =
      [
        now.getFullYear(),

        String(
          now.getMonth() + 1
        ).padStart(
          2,
          "0"
        ),

        String(
          now.getDate()
        ).padStart(
          2,
          "0"
        )
      ].join("-");

    const time =
      [
        String(
          now.getHours()
        ).padStart(
          2,
          "0"
        ),

        String(
          now.getMinutes()
        ).padStart(
          2,
          "0"
        )
      ].join("-");

    const filename =
      `shop-hopper-demo-data-${date}-${time}.json`;

    const link =
      document.createElement(
        "a"
      );

    link.href =
      url;

    link.download =
      filename;

    document.body.appendChild(
      link
    );

    link.click();

    link.remove();

    setTimeout(
      () => {
        URL.revokeObjectURL(
          url
        );
      },
      1000
    );
  }

  /* ============================================================
     VALIDATE IMPORT
     ============================================================ */

  function validateImportedState(
    candidate
  ) {
    if (
      !candidate ||
      typeof candidate !==
        "object"
    ) {
      return false;
    }

    if (
      !Array.isArray(
        candidate.merchants
      )
    ) {
      return false;
    }

    if (
      !Array.isArray(
        candidate.stores
      )
    ) {
      return false;
    }

    if (
      !Array.isArray(
        candidate.items
      )
    ) {
      return false;
    }

    return true;
  }

  /* ============================================================
     IMPORT
     ============================================================ */

  async function importShopHopperData(
    file
  ) {
    if (!file) {
      return;
    }

    let parsed;

    try {
      const text =
        await file.text();

      parsed =
        JSON.parse(
          text
        );
    } catch (error) {
      console.error(
        error
      );

      alert(
        "That file could not be read as Shop Hopper JSON data."
      );

      return;
    }

    /*
     * Accept both:
     *
     * 1. Our exported package:
     *    { application, version, exportedAt, data }
     *
     * 2. A raw Shop Hopper state object.
     */
    const importedState =
      parsed?.data &&
      typeof parsed.data ===
        "object"
        ? parsed.data
        : parsed;

    if (
      !validateImportedState(
        importedState
      )
    ) {
      alert(
        "This does not appear to be a valid Shop Hopper prototype backup."
      );

      return;
    }

    const merchantCount =
      importedState.merchants.length;

    const storeCount =
      importedState.stores.length;

    const itemCount =
      importedState.items.length;

    const hopperCount =
      Array.isArray(
        importedState.hoppers
      )
        ? importedState.hoppers.length
        : 0;

    const hopperPickCount =
      Array.isArray(
        importedState.hopperLists
      )
        ? importedState.hopperLists.reduce(
            (
              total,
              list
            ) =>
              total +
              (
                Array.isArray(
                  list.entries
                )
                  ? list.entries.length
                  : 0
              ),
            0
          )
        : 0;

    const approved =
      confirm(
        "Import this Shop Hopper backup?\n\n" +
        `${merchantCount} merchants\n` +
        `${storeCount} stores\n` +
        `${itemCount} products/items\n` +
        `${hopperCount} Hopper profiles\n` +
        `${hopperPickCount} Hopper picks\n\n` +
        "Your current browser data will be replaced."
      );

    if (!approved) {
      return;
    }

    /*
     * Save an automatic browser-side copy of the current
     * state before replacing anything.
     */
    try {
      localStorage.setItem(
        PRE_IMPORT_BACKUP_KEY,
        JSON.stringify(
          state
        )
      );
    } catch (error) {
      console.warn(
        "Could not create pre-import backup.",
        error
      );
    }

    /*
     * Replace the active prototype state.
     */
    state =
      importedState;

    saveState();

    /*
     * Reset temporary UI selections to safe values.
     */
    ui.selectedMerchantId =
      state.merchants[0]?.id ||
      null;

    ui.merchantStoreId =
      null;

    ui.marketplaceSlug =
      "pacific-beach";

    ui.selectedMapMarketplace =
      "pacific-beach";

    ui.category =
      "all";

    ui.search =
      "";

    /*
     * Keep the user on the Hopper profile when possible.
     */
    if (
      Array.isArray(
        state.hoppers
      ) &&
      state.hoppers.length
    ) {
      ui.persona =
        "hopper";

      ui.selectedHopperId =
        state.hoppers[0].id;
    } else {
      ui.persona =
        "shopper";

      ui.shopperView =
        "home";
    }

    renderAll();

    alert(
      "Shop Hopper data imported successfully."
    );
  }

  /* ============================================================
     BUTTON EVENTS
     ============================================================ */

  document.addEventListener(
    "click",
    event => {
      const button =
        event.target.closest(
          "[data-demo-data-action]"
        );

      if (!button) {
        return;
      }

      const action =
        button.dataset
          .demoDataAction;

      if (
        action ===
        "export"
      ) {
        exportShopHopperData();

        return;
      }

      if (
        action ===
        "import"
      ) {
        const fileInput =
          document.getElementById(
            "shopHopperImportFile"
          );

        if (!fileInput) {
          return;
        }

        /*
         * Clearing the value allows the same backup
         * file to be selected twice if necessary.
         */
        fileInput.value =
          "";

        fileInput.click();
      }
    }
  );

  document.addEventListener(
    "change",
    event => {
      if (
        event.target.id !==
        "shopHopperImportFile"
      ) {
        return;
      }

      const file =
        event.target.files?.[0];

      if (file) {
        importShopHopperData(
          file
        );
      }
    }
  );

  installDataTools();
})();
</script>

<script>
(() => {
  "use strict";

  const LAST_EXPORT_KEY =
    `${STORAGE_KEY}-last-export-at`;

  function formatBackupDate(value) {
    if (!value) {
      return null;
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return null;
    }

    return date.toLocaleString(
      undefined,
      {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      }
    );
  }

  function updateBackupStatus() {
    const status =
      document.getElementById(
        "demoBackupStatus"
      );

    const text =
      document.getElementById(
        "demoBackupStatusText"
      );

    if (!status || !text) {
      return;
    }

    const saved =
      localStorage.getItem(
        LAST_EXPORT_KEY
      );

    const formatted =
      formatBackupDate(
        saved
      );

    if (!formatted) {
      status.classList.remove(
        "has-backup"
      );

      text.textContent =
        "No export recorded";

      return;
    }

    status.classList.add(
      "has-backup"
    );

    text.textContent =
      `Last Export: ${formatted}`;
  }

  function installBackupStatus() {
    const tools =
      document.getElementById(
        "demoDataTools"
      );

    if (!tools) {
      return false;
    }

    let status =
      document.getElementById(
        "demoBackupStatus"
      );

    if (!status) {
      tools.insertAdjacentHTML(
        "afterbegin",
        `
          <div
            id="demoBackupStatus"
            class="demo-backup-status"
            title="Last prototype data export"
          >
            <span
              class="demo-backup-dot"
            ></span>

            <span>
              <span
                class="demo-backup-label"
              >
                Backup:
              </span>

              <span
                id="demoBackupStatusText"
              >
                No export recorded
              </span>
            </span>
          </div>
        `
      );
    }

    updateBackupStatus();

    return true;
  }

  /*
   * Record the time whenever Export Data is clicked.
   */
  document.addEventListener(
    "click",
    event => {
      const exportButton =
        event.target.closest(
          '[data-demo-data-action="export"]'
        );

      if (!exportButton) {
        return;
      }

      localStorage.setItem(
        LAST_EXPORT_KEY,
        new Date().toISOString()
      );

      installBackupStatus();

      setTimeout(
        updateBackupStatus,
        50
      );
    }
  );

  /*
   * Install immediately.
   */
  if (!installBackupStatus()) {
    /*
     * Safety fallback in case the Export/Import controls
     * have not been created yet.
     */
    const observer =
      new MutationObserver(
        () => {
          if (
            installBackupStatus()
          ) {
            observer.disconnect();
          }
        }
      );

    observer.observe(
      document.body,
      {
        childList: true,
        subtree: true
      }
    );
  }
})();
</script>

<script>

  window.__shopHopperPersonaBuilderInstalled =
    true;

  /* ============================================================
     HELPERS
     ============================================================ */

  function getAllHoppers() {
    if (
      !Array.isArray(
        state.hoppers
      )
    ) {
      state.hoppers = [];
    }

    return state.hoppers;
  }

  function getAllHopperLists() {
    if (
      !Array.isArray(
        state.hopperLists
      )
    ) {
      state.hopperLists = [];
    }

    return state.hopperLists;
  }

  function getCurrentHopper() {
    return (
      getAllHoppers().find(
        hopper =>
          hopper.id ===
          ui.selectedHopperId
      ) ||
      null
    );
  }

  function getCurrentHopperList() {
    const hopper =
      getCurrentHopper();

    if (!hopper) {
      return null;
    }

    return (
      getAllHopperLists().find(
        list =>
          list.hopperId ===
          hopper.id
      ) ||
      null
    );
  }

  function normalizePersonaMerchantName(
    value
  ) {
    return String(
      value || ""
    )
      .trim()
      .toLowerCase()
      .replace(
        /[^a-z0-9]+/g,
        " "
      )
      .trim();
  }

  function findPersonaMerchant(
    name
  ) {
    const normalized =
      normalizePersonaMerchantName(
        name
      );

    return (
      state.merchants.find(
        merchant =>
          normalizePersonaMerchantName(
            merchant.businessName
          ) ===
          normalized
      ) ||
      null
    );
  }

  function nextHopperNumber() {
    let largest =
      -1;

    getAllHoppers().forEach(
      hopper => {
        const match =
          String(
            hopper.name || ""
          ).match(
            /hopper\s+(\d+)/i
          );

        if (!match) {
          return;
        }

        largest =
          Math.max(
            largest,
            Number(
              match[1]
            )
          );
      }
    );

    return largest + 1;
  }

  function marketplaceForSlug(
    slug
  ) {
    return (
      MARKETPLACES.find(
        marketplace =>
          marketplace.slug ===
          slug
      ) ||
      MARKETPLACES[0]
    );
  }

  /* ============================================================
     PERSONA DROPDOWN
     Show ALL Hopper personas, not just The Surfer
     ============================================================ */

  renderPersonaSelect =
    function renderPersonaSelectWithDynamicHoppers() {
      const hopperOptions =
        getAllHoppers()
          .map(
            hopper => `
              <option
                value="hopper:${escapeHtml(
                  hopper.id
                )}"
                ${
                  ui.persona ===

                    : ""
                }
              >

                  hopper.personaName
                )}
              </option>
            `
          )

      const merchantOptions =
        state.merchants
          .map(
            merchant => `
              <option
                value="merchant:${escapeHtml(
                  merchant.id
                )}"
                ${
                  ui.persona ===
                    "merchant" &&

                    merchant.id
                    ? "selected"
                    : ""
                }
              >
                Merchant — ${escapeHtml(
                  merchant.businessName
                )}
              </option>
            `
          )
          .join("");

      personaSelect.innerHTML = `
        <option
          value="shopper"
          ${
            ui.persona ===
              "shopper"
              ? "selected"
              : ""
          }
        >

              : ""
          }

  /* ============================================================

      `
    );

  /* ============================================================
     CREATE PERSONA
     ============================================================ */

  function openAddHopperPersona() {
    openModal({
      title:
        "Add Hopper Persona",

      submitLabel:
        "Create Persona",

      body: `
        <div class="notice">
          Create another local Hopper personality.
          It will have its own profile and curated list.
        </div>

        <div class="form-grid">

          <div class="field">

            />

        </div>
      `,

      onSubmit(form) {
        const data =
          new FormData(

          );

        const personaName =
          String(

              "personaName"

            ""

            ""
          )
            .split(",")
            .map(
              value =>
                value.trim()
            )
            .filter(Boolean);

        const listTitle =
          String(
            data.get(
              "listTitle"
            ) ||
            ""
          ).trim();

        const listDescription =
          String(
            data.get(
              "listDescription"
            ) ||
            ""
          ).trim();

        if (
          !personaName ||
          !listTitle
        ) {
          alert(
            "Please enter a persona name and curated list title."
          );

          return;
        }

        const marketplace =
          marketplaceForSlug(
            marketplaceSlug
          );

        const hopper = {
          id:
            uid(
              "hopper"
            ),

          name:
            `Hopper ${nextHopperNumber()}`,

          personaName,

          avatar,

          marketplaceSlug,

          marketplaceName:
            marketplace.name,

          interests:
            interests.length
              ? interests
              : [
                  "Local Finds"
                ]
        };

        getAllHoppers().push(
          hopper
        );

        getAllHopperLists().push({
          id:
            uid(
              "hopper-list"
            ),

          hopperId:
            hopper.id,

          title:
            listTitle,

          description:
            listDescription,

          entries:
            []
        });

        saveState();

        ui.persona =
          "hopper";

        ui.selectedHopperId =
          hopper.id;

        closeModal();

        renderAll();
      }
    });
  }

  /* ============================================================
     ADD LOCAL FIND FOR A USER-CREATED HOPPER
     ============================================================ */

  function openDynamicHopperFind() {
    const hopper =
      getCurrentHopper();

    const list =
      getCurrentHopperList();

    if (
      !hopper ||
      !list
    ) {
      return;
    }

    const marketplace =
      marketplaceForSlug(
        hopper.marketplaceSlug
      );

    openModal({
      title:
        `Add Find for ${hopper.personaName}`,

      submitLabel:
        "Add to Shop Hopper",

      body: `
        <div class="notice">
          Add a merchant, store and product to
          ${escapeHtml(
            hopper.personaName
          )}'s curated list.
        </div>

        <div class="form-grid">

          <div class="field full">

            <label>
              Merchant
            </label>

            <input
              name="merchantName"
              required
              placeholder="Merchant name"
            />

          </div>

          <div class="field full">

            <label>
              Store name
            </label>

            <input
              name="storeName"
              required
              placeholder="Store name"
            />

          </div>

          <div class="field full">

            <label>
              Item / local find
            </label>

            <input
              name="itemName"
              required
              placeholder="Product or local find"
            />

          </div>

          <div class="field full">

            <label>
              Description
            </label>

            <textarea
              name="description"
              placeholder="Describe the item..."
            ></textarea>

          </div>

          <div class="field">

            <label>
              Category
            </label>

            <select
              name="category"
            >
              ${categoryOptions(
                "fashion"
              )}
            </select>

          </div>

          <div class="field">

            <label>
              Price ($)
            </label>

            <input
              name="price"
              type="number"
              min="0"
              step="0.01"
              required
              placeholder="0.00"
            />

          </div>

          <div class="field full">

            <label>
              Store address
            </label>

            <input
              name="address"
              required
              placeholder="Street address"
            />

          </div>

          <div class="field">

            <label>
              Marketplace
            </label>

            <select
              name="marketplaceSlug"
            >
              ${marketplaceOptions(
                hopper.marketplaceSlug
              )}
            </select>

          </div>

          <div class="field">

            <label>
              Quantity
            </label>

            <input
              name="qty"
              type="number"
              step="1"
              value="1"
            />

          </div>

          <div class="field">

            <label>
              Latitude
            </label>

            <input
              name="lat"
              type="number"
              step="0.000001"
              required
              value="${escapeHtml(
                marketplace.lat
              )}"
            />

          </div>

          <div class="field">

            <label>
              Longitude
            </label>

            <input
              name="lng"
              type="number"
              step="0.000001"
              required
              value="${escapeHtml(
                marketplace.lng
              )}"
            />

          </div>

          <div class="field full">

            <label>
              Image URL
            </label>

            <input
              name="image"
              type="url"
              placeholder="https://..."
            />

          </div>

          <div class="field full">

            <label>
              Hopper note
            </label>

            <textarea
              name="hopperNote"
              placeholder="Why does this Hopper recommend it?"
            ></textarea>

          </div>

        </div>
      `,

      onSubmit(form) {
        const data =
          new FormData(
            form
          );

        const merchantName =
          String(
            data.get(
              "merchantName"
            ) ||
            ""
          ).trim();

        const storeName =
          String(
            data.get(
              "storeName"
            ) ||
            ""
          ).trim();

        const itemName =
          String(
            data.get(
              "itemName"
            ) ||
            ""
          ).trim();

        const description =
          String(
            data.get(
              "description"
            ) ||
            ""
          ).trim();

        const category =
          normalizeCategory(
            data.get(
              "category"
            )
          );

        const price =
          Number(
            data.get(
              "price"
            )
          );

        const qty =
          Number(
            data.get(
              "qty"
            ) ||
            1
          );

        const address =
          String(
            data.get(
              "address"
            ) ||
            ""
          ).trim();

        const marketplaceSlug =
          String(
            data.get(
              "marketplaceSlug"
            ) ||
            hopper.marketplaceSlug
          );

        const lat =
          Number(
            data.get(
              "lat"
            )
          );

        const lng =
          Number(
            data.get(
              "lng"
            )
          );

        const image =
          String(
            data.get(
              "image"
            ) ||
            ""
          ).trim() ||
          PRODUCT_PLACEHOLDER;

        const hopperNote =
          String(
            data.get(
              "hopperNote"
            ) ||
            ""
          ).trim();

        if (
          !merchantName ||
          !storeName ||
          !itemName ||
          !address
        ) {
          alert(
            "Please complete the merchant, store, item and address."
          );

          return;
        }

        if (
          !Number.isFinite(
            price
          ) ||
          price < 0
        ) {
          alert(
            "Please enter a valid price."
          );

          return;
        }

        if (
          !Number.isFinite(
            lat
          ) ||
          !Number.isFinite(
            lng
          )
        ) {
          alert(
            "Please enter valid latitude and longitude."
          );

          return;
        }

        let merchant =
          findPersonaMerchant(
            merchantName
          );

        if (!merchant) {
          merchant = {
            id:
              uid(
                "merchant"
              ),

            businessName:
              merchantName,

            ownerName:
              "",

            email:
              "",

            phone:
              "",

            status:
              "active"
          };

          state.merchants.push(
            merchant
          );
        }

        let store =
          state.stores.find(
            candidate =>
              candidate.merchantId ===
                merchant.id &&
              String(
                candidate.name
              )
                .trim()
                .toLowerCase() ===
              storeName
                .trim()
                .toLowerCase()
          );

        if (!store) {
          store = {
            id:
              uid(
                "store"
              ),

            merchantId:
              merchant.id,

            name:
              storeName,

            description:
              "",

            address,

            marketplaceSlug,

            category,

            lat,

            lng,

            published:
              true
          };

          state.stores.push(
            store
          );
        } else {
          store.address =
            address;

          store.marketplaceSlug =
            marketplaceSlug;

          store.lat =
            lat;

          store.lng =
            lng;

          store.published =
            true;
        }

        const item = {
          id:
            uid(
              "item"
            ),

          storeId:
            store.id,

          title:
            itemName,

          description,

          category,

          type:
            "product",

          priceCents:
            Math.round(
              price *
              100
            ),

          qty:
            Number.isFinite(
              qty
            )
              ? qty
              : 1,

          image,

          featured:
            true,

          active:
            true,

          createdByHopperId:
            hopper.id
        };

        state.items.push(
          item
        );

        list.entries.push({
          id:
            uid(
              "hopper-pick"
            ),

          itemName,

          merchantName,

          merchantId:
            merchant.id,

          suggestedCategory:
            category,

          itemId:
            item.id,

          note:
            hopperNote
        });

        saveState();

        closeModal();

        renderAll();
      }
    });
  }

  /* ============================================================
     DECORATE HOPPER PROFILE
     Existing Hopper renderer is already mostly generic.
     This swaps in each persona's chosen emoji.
     ============================================================ */

  function refreshDynamicHopperDisplay() {
    if (
      ui.persona !==
      "hopper"
    ) {
      return;
    }

    const hopper =
      getCurrentHopper();

    if (!hopper) {
      return;
    }

    const avatar =
      document.querySelector(
        ".hopper-avatar"
      );

    if (avatar) {
      avatar.textContent =
        hopper.avatar ||
        (
          hopper.id ===
            "hopper-surfer"
            ? "🏄"
            : "✨"
        );
    }

    const picks =
      document.querySelector(
        ".hopper-picks"
      );

    const list =
      getCurrentHopperList();

    if (
      picks &&
      list &&
      Array.isArray(
        list.entries
      ) &&
      list.entries.length ===
        0 &&
      !picks.querySelector(
        ".hopper-empty-picks"
      )
    ) {
      picks.innerHTML = `
        <div class="hopper-empty-picks">

          <strong>
            No local finds yet.
          </strong>

          <span>
            Use + Add Local Find to start this persona's curated list.
          </span>

        </div>
      `;
    }
  }

  /* ============================================================
     EVENTS
     ============================================================ */

  document.addEventListener(
    "click",
    event => {
      const addPersona =
        event.target.closest(
          '[data-persona-builder="add"]'
        );

      if (addPersona) {
        openAddHopperPersona();

        return;
      }

      /*
       * The original Surfer extension has its own
       * Add Local Find handler.
       *
       * For any user-created Hopper we intercept
       * that click and use the generic version.
       */
      const addFind =
        event.target.closest(
          '[data-action="hopper-add-local-find"]'
        );

      if (
        addFind &&
        ui.persona ===
          "hopper" &&
        ui.selectedHopperId &&
        ui.selectedHopperId !==
          "hopper-surfer"
      ) {
        event.preventDefault();

        event.stopImmediatePropagation();

        openDynamicHopperFind();
      }
    },
    true
  );

/* ============================================================
   REFRESH HOPPER DISPLAY SAFELY
   No MutationObserver — avoids render loops.
   ============================================================ */

const originalRenderAllDynamicPersona =
  renderAll;

renderAll =
  function renderAllWithDynamicPersonaDisplay() {
    originalRenderAllDynamicPersona();

    if (
      ui.persona ===
      "hopper"
    ) {
      requestAnimationFrame(
        () => {
          refreshDynamicHopperDisplay();
        }
      );
    }
  };

  /* ============================================================
     INITIALIZE
     ============================================================ */

installPersonaButton();

renderPersonaSelect();

if (
  ui.persona ===
  "hopper"
) {
  refreshDynamicHopperDisplay();
}
})();
</script>
<!-- ============================================================

     ============================================================ -->

<style>

  }

  @media (max-width: 650px) {
    .hopper-manage-actions {
      width: 100%;

      margin-left: 0;
    }

    .hopper-manage-button {
      flex: 1;
    }
  }
</style>

<script>
(() => {
  "use strict";

  if (
    window.__shopHopperPersonaManagementInstalled
  ) {
    return;
  }

  window.__shopHopperPersonaManagementInstalled =
    true;

  const PROTECTED_HOPPER_ID =
    "hopper-surfer";

  /* ============================================================
     HELPERS
     ============================================================ */

  function findManagedHopper(
    hopperId
  ) {
    if (
      !Array.isArray(
        state.hoppers
      )
    ) {
      return null;
    }

    return (
      state.hoppers.find(
        hopper =>
          hopper.id ===
          hopperId
      ) ||
      null
    );
  }

  function findManagedHopperList(
    hopperId
  ) {
    if (
      !Array.isArray(
        state.hopperLists
      )
    ) {
      return null;
    }

    return (
      state.hopperLists.find(
        list =>
          list.hopperId ===
          hopperId
      ) ||
      null
    );
  }

  function findMarketplaceForPersona(
    slug
  ) {
    return (
      MARKETPLACES.find(
        marketplace =>
          marketplace.slug ===
          slug
      ) ||
      MARKETPLACES[0]
    );
  }

  /* ============================================================
     ADD MANAGEMENT CONTROLS TO CURRENT HOPPER
     ============================================================ */

  function installHopperManagementControls() {
    if (
      ui.persona !==
      "hopper"
    ) {
      return;
    }

    const card =
      document.querySelector(
        ".hopper-profile-card"
      );

    if (!card) {
      return;
    }

    const oldControls =
      card.querySelector(
        ".hopper-manage-actions"
      );

    if (oldControls) {
      oldControls.remove();
    }

    const hopper =
      findManagedHopper(
        ui.selectedHopperId
      );

    if (!hopper) {
      return;
    }

    /*
     * Hopper 0 stays protected as our
     * permanent seed/demo persona.
     */
    if (
      hopper.id ===
      PROTECTED_HOPPER_ID
    ) {
      card.insertAdjacentHTML(
        "beforeend",
        `
          <div
            class="hopper-manage-actions"
          >
            <span
              class="hopper-seed-badge"
              title="This is the protected Shop Hopper seed persona"
            >
              <i class="fa-solid fa-lock"></i>
              Seed Persona
            </span>
          </div>
        `
      );

      return;
    }

    card.insertAdjacentHTML(
      "beforeend",
      `
        <div
          class="hopper-manage-actions"
        >
          <button
            type="button"
            class="
              hopper-manage-button
              hopper-manage-edit
            "
            data-hopper-manage="edit"
            data-hopper-id="${escapeHtml(
              hopper.id
            )}"
          >
            <i class="fa-solid fa-pen"></i>
            &nbsp;
            Edit Persona
          </button>

          <button
            type="button"
            class="
              hopper-manage-button
              hopper-manage-delete
            "
            data-hopper-manage="delete"
            data-hopper-id="${escapeHtml(
              hopper.id
            )}"
          >
            <i class="fa-solid fa-trash"></i>
            &nbsp;
            Delete Persona
          </button>
        </div>
      `
    );
  }

  /* ============================================================
     EDIT PERSONA
     ============================================================ */

  function openEditHopperPersona(
    hopperId
  ) {
    const hopper =
      findManagedHopper(
        hopperId
      );

    if (!hopper) {
      return;
    }

    if (
      hopper.id ===
      PROTECTED_HOPPER_ID
    ) {
      alert(
        "Hopper 0 — The Surfer is the protected seed persona."
      );

      return;
    }

    const list =
      findManagedHopperList(
        hopper.id
      );

    const interests =
      Array.isArray(
        hopper.interests
      )
        ? hopper.interests.join(
            ", "
          )
        : "";

    openModal({
      title:
        "Edit Hopper Persona",

      submitLabel:
        "Save Changes",

      body: `
        <div class="notice">
          Update this Hopper's personality,
          interests and curated list.
        </div>

        <div class="form-grid">

          <div class="field">

            <label>
              Persona name
            </label>

            <input
              name="personaName"
              required
              value="${escapeHtml(
                hopper.personaName ||
                ""
              )}"
            />

          </div>

          <div class="field">

            <label>
              Avatar emoji
            </label>

            <input
              name="avatar"
              maxlength="8"
              value="${escapeHtml(
                hopper.avatar ||
                "✨"
              )}"
              placeholder="🛹"
            />

          </div>

          <div class="field full">

            <label>
              Marketplace / Area
            </label>

            <select
              name="marketplaceSlug"
            >
              ${marketplaceOptions(
                hopper.marketplaceSlug ||
                "pacific-beach"
              )}
            </select>

          </div>

          <div class="field full">

            <label>
              Interests
            </label>

            <input
              name="interests"
              value="${escapeHtml(
                interests
              )}"
              placeholder="Skate, Streetwear, Coffee"
            />

          </div>

          <div class="field full">

            <label>
              Curated list title
            </label>

            <input
              name="listTitle"
              required
              value="${escapeHtml(
                list?.title ||
                ""
              )}"
            />

          </div>

          <div class="field full">

            <label>
              List description
            </label>

            <textarea
              name="listDescription"
              placeholder="Describe this Hopper's local list..."
            >${escapeHtml(
              list?.description ||
              ""
            )}</textarea>

          </div>

        </div>
      `,

      onSubmit(form) {
        const data =
          new FormData(
            form
          );

        const personaName =
          String(
            data.get(
              "personaName"
            ) ||
            ""
          ).trim();

        const avatar =
          String(
            data.get(
              "avatar"
            ) ||
            "✨"
          ).trim() ||
          "✨";

        const marketplaceSlug =
          String(
            data.get(
              "marketplaceSlug"
            ) ||
            "pacific-beach"
          );

        const interests =
          String(
            data.get(
              "interests"
            ) ||
            ""
          )
            .split(",")
            .map(
              value =>
                value.trim()
            )
            .filter(Boolean);

        const listTitle =
          String(
            data.get(
              "listTitle"
            ) ||
            ""
          ).trim();

        const listDescription =
          String(
            data.get(
              "listDescription"
            ) ||
            ""
          ).trim();

        if (
          !personaName ||
          !listTitle
        ) {
          alert(
            "Please enter a persona name and curated list title."
          );

          return;
        }

        const marketplace =
          findMarketplaceForPersona(
            marketplaceSlug
          );

        hopper.personaName =
          personaName;

        hopper.avatar =
          avatar;

        hopper.marketplaceSlug =
          marketplace.slug;

        hopper.marketplaceName =
          marketplace.name;

        hopper.interests =
          interests.length
            ? interests
            : [
                "Local Finds"
              ];

        if (list) {
          list.title =
            listTitle;

          list.description =
            listDescription;
        }

        saveState();

        closeModal();

        renderAll();
      }
    });
  }

  /* ============================================================
     DELETE PERSONA
     ============================================================ */

  function deleteHopperPersona(
    hopperId
  ) {
    const hopper =
      findManagedHopper(
        hopperId
      );

    if (!hopper) {
      return;
    }

    if (
      hopper.id ===
      PROTECTED_HOPPER_ID
    ) {
      alert(
        "Hopper 0 — The Surfer cannot be deleted."
      );

      return;
    }

    const list =
      findManagedHopperList(
        hopper.id
      );

    const pickCount =
      Array.isArray(
        list?.entries
      )
        ? list.entries.length
        : 0;

    const approved =
      confirm(
        `Delete "${hopper.personaName}"?\n\n` +
        `This will remove the Hopper profile and its curated list` +
        ` (${pickCount} ${pickCount === 1 ? "pick" : "picks"}).\n\n` +
        "Merchants, stores and products already added by this Hopper will remain in Shop Hopper."
      );

    if (!approved) {
      return;
    }

    state.hoppers =
      state.hoppers.filter(
        candidate =>
          candidate.id !==
          hopper.id
      );

    state.hopperLists =
      state.hopperLists.filter(
        candidate =>
          candidate.hopperId !==
          hopper.id
      );

    /*
     * Return to the protected Surfer persona.
     */
    ui.persona =
      "hopper";

    ui.selectedHopperId =
      PROTECTED_HOPPER_ID;

    saveState();

    renderAll();
  }

  /* ============================================================
     BUTTON EVENTS
     ============================================================ */

  document.addEventListener(
    "click",
    event => {
      const button =
        event.target.closest(
          "[data-hopper-manage]"
        );

      if (!button) {
        return;
      }

      const action =
        button.dataset
          .hopperManage;

      const hopperId =
        button.dataset
          .hopperId;

      if (
        action ===
        "edit"
      ) {
        openEditHopperPersona(
          hopperId
        );

        return;
      }

      if (
        action ===
        "delete"
      ) {
        deleteHopperPersona(
          hopperId
        );
      }
    }
  );

  /* ============================================================
     SAFE RENDER HOOK
     No MutationObserver.
     ============================================================ */

  const previousRenderAllPersonaManagement =
    renderAll;

  renderAll =
    function renderAllWithPersonaManagement() {
      previousRenderAllPersonaManagement();

      if (
        ui.persona ===
        "hopper"
      ) {
        requestAnimationFrame(
          () => {
            installHopperManagementControls();
          }

<script>
(() => {
  "use strict";

  if (
    window.__shopHopperCatalogPickerInstalled
  ) {
    return;
  }

  window.__shopHopperCatalogPickerInstalled =
    true;

  let bypassCatalogPicker =
    false;

  /* ============================================================
     CURRENT HOPPER / LIST
     ============================================================ */

  function catalogCurrentHopper() {
    if (
      ui.persona !==
      "hopper"
    ) {
      return null;
    }

    return (
      state.hoppers?.find(
        hopper =>
          hopper.id ===
          ui.selectedHopperId
      ) ||
      null
    );
  }

  function catalogCurrentList() {
    const hopper =
      catalogCurrentHopper();

    if (!hopper) {
      return null;
    }

    return (
      state.hopperLists?.find(
        list =>
          list.hopperId ===
          hopper.id
      ) ||
      null
    );
  }

  /* ============================================================
     CATALOG SEARCH
     ============================================================ */

  function getHopperCatalogResults(
    searchValue = ""
  ) {
    const search =
      String(
        searchValue
      )
        .trim()
        .toLowerCase();

    return state.items
      .map(
        item => {
          const store =
            getStore(
              item.storeId
            );

          if (!store) {
            return null;
          }

          const merchant =
            getMerchant(
              store.merchantId
            );

          if (!merchant) {
            return null;
          }

          return {
            item,
            store,
            merchant
          };
        }
      )
      .filter(Boolean)
      .filter(
        result =>
          result.item.active &&
          result.store.published
      )
      .filter(
        result => {
          if (!search) {
            return true;
          }

          const haystack = [
            result.item.title,
            result.item.description,
            result.item.category,
            result.store.name,
            result.store.address,
            result.merchant.businessName
          ]
            .join(" ")
            .toLowerCase();

          return haystack.includes(
            search
          );
        }
      )
      .sort(
        (a, b) =>
          a.item.title.localeCompare(
            b.item.title
          )
      );
  }

  function renderHopperCatalogResults(
    searchValue = ""
  ) {
    const container =
      document.getElementById(
        "hopperCatalogResults"
      );

    if (!container) {
      return;
    }

    const list =
      catalogCurrentList();

    const results =
      getHopperCatalogResults(
        searchValue
      );

    if (!results.length) {
      container.innerHTML = `
        <div class="hopper-catalog-empty">
          No matching Shop Hopper items found.
          <br />
          You can create a new local find below.
        </div>
      `;

      return;
    }

    container.innerHTML =
      results
        .map(
          ({
            item,
            store,
            merchant
          }) => {
            /*
             * Same product may belong to MANY different
             * Hopper lists.
             *
             * We only prevent adding the identical item
             * twice to THIS Hopper's list.
             */
            const alreadyInThisList =
              Array.isArray(
                list?.entries
              ) &&
              list.entries.some(
                entry =>
                  entry.itemId ===
                  item.id
              );

            return `
              <article
                class="hopper-catalog-result"
              >

                <img
                  class="hopper-catalog-image"
                  src="${escapeHtml(
                    safeUrl(
                      item.image
                    )
                  )}"
                  alt="${escapeHtml(
                    item.title
                  )}"
                />

                <div
                  class="hopper-catalog-copy"
                >

                  <div
                    class="hopper-catalog-title"
                  >
                    ${escapeHtml(
                      item.title
                    )}
                  </div>

                  <div
                    class="hopper-catalog-store"
                  >
                    ${escapeHtml(
                      store.name
                    )}
                  </div>

                  <div
                    class="hopper-catalog-meta"
                  >
                    ${money(
                      item.priceCents
                    )}
                    ·
                    ${escapeHtml(
                      marketplaceLabel(
                        store
                      )
                    )}
                  </div>

                </div>

                ${
                  alreadyInThisList
                    ? `
                      <button
                        type="button"
                        class="
                          hopper-catalog-add
                          added
                        "
                        disabled
                      >
                        <i class="fa-solid fa-check"></i>
                        In This List
                      </button>
                    `
                    : `
                      <button
                        type="button"
                        class="hopper-catalog-add"
                        data-hopper-catalog-action="add"
                        data-item-id="${escapeHtml(
                          item.id
                        )}"
                      >
                        + Add
                      </button>
                    `
                }

              </article>
            `;
          }
        )
        .join("");
  }

  /* ============================================================
     OPEN PICKER
     ============================================================ */

  function openHopperCatalogPicker() {
    const hopper =
      catalogCurrentHopper();

    const list =
      catalogCurrentList();

    if (
      !hopper ||
      !list
    ) {
      return;
    }

    openModal({
      title:
        `Add Local Find — ${hopper.personaName}`,

      submitLabel:
        null,

      body: `
        <div class="notice">
          Search Shop Hopper first, or create something new.
          Each Hopper has their own independent favorites list.
        </div>

        <div
          class="hopper-catalog-search-wrap"
        >
          <i
            class="
              fa-solid
              fa-magnifying-glass
              hopper-catalog-search-icon
            "
          ></i>

          <input
            id="hopperCatalogSearch"
            class="hopper-catalog-search"
            type="search"
            placeholder="Search products, stores or merchants..."
            autocomplete="off"
          />
        </div>

        <div class="hopper-catalog-help">
          The same product can be favorited by multiple Hoppers.
        </div>

        <div
          id="hopperCatalogResults"
          class="hopper-catalog-results"
        ></div>

        <div
          class="hopper-create-find-divider"
        >
          or
        </div>

        <button
          type="button"
          class="hopper-create-new-find"
          data-hopper-catalog-action="create"
        >
          <i class="fa-solid fa-circle-plus"></i>
          &nbsp;
          Create New Local Find
        </button>
      `
    });

    renderHopperCatalogResults(
      ""
    );
  }

  /* ============================================================
     ADD EXISTING CATALOG ITEM TO CURRENT HOPPER
     ============================================================ */

  function addCatalogItemToHopper(
    itemId
  ) {
    const hopper =
      catalogCurrentHopper();

    const list =
      catalogCurrentList();

    const item =
      getItem(
        itemId
      );

    if (
      !hopper ||
      !list ||
      !item
    ) {
      return;
    }

    const store =
      getStore(
        item.storeId
      );

    if (!store) {
      return;
    }

    const merchant =
      getMerchant(
        store.merchantId
      );

    if (!merchant) {
      return;
    }

    if (
      list.entries.some(
        entry =>
          entry.itemId ===
          item.id
      )
    ) {
      return;
    }

    list.entries.push({
      id:
        uid(
          "hopper-pick"
        ),

      itemName:
        item.title,

      merchantName:
        merchant.businessName,

      merchantId:
        merchant.id,

      suggestedCategory:
        item.category,

      itemId:
        item.id,

      note:
        ""
    });

    saveState();

    closeModal();

    renderAll();
  }

  /* ============================================================
     SEARCH EVENTS
     ============================================================ */

  document.addEventListener(
    "input",
    event => {
      if (
        event.target.id !==
        "hopperCatalogSearch"
      ) {
        return;
      }

      renderHopperCatalogResults(
        event.target.value
      );
    }
  );

  /* ============================================================
     PICKER BUTTON EVENTS
     ============================================================ */

  document.addEventListener(
    "click",
    event => {
      const button =
        event.target.closest(
          "[data-hopper-catalog-action]"
        );

      if (!button) {
        return;
      }

      const action =
        button.dataset
          .hopperCatalogAction;

      if (
        action ===
        "add"
      ) {
        addCatalogItemToHopper(
          button.dataset.itemId
        );

        return;
      }

      if (
        action ===
        "create"
      ) {
        /*
         * Close the search picker, then deliberately
         * allow the EXISTING Add Local Find workflow
         * to run once.
         *
         * Surfer keeps its existing form.
         * User-created Hoppers keep their existing form.
         */
        closeModal();

        const originalAddButton =
          document.querySelector(
            '[data-action="hopper-add-local-find"]'
          );

        if (!originalAddButton) {
          return;
        }

        bypassCatalogPicker =
          true;

        originalAddButton.click();
      }
    }
  );

  /* ============================================================
     INTERCEPT + ADD LOCAL FIND
     Window capture runs before the existing document handlers.
     ============================================================ */

  window.addEventListener(
    "click",
    event => {
      const button =
        event.target.closest(
          '[data-action="hopper-add-local-find"]'
        );

      if (
        !button ||
        ui.persona !==
          "hopper"
      ) {
        return;
      }

      /*
       * Used only when "Create New Local Find"
       * intentionally hands control back to the
       * original Hopper creation workflow.
       */
      if (
        bypassCatalogPicker
      ) {
        bypassCatalogPicker =
          false;

        return;
      }

      event.preventDefault();

      event.stopImmediatePropagation();

      openHopperCatalogPicker();
    },
    true
  );
})();
</script>

          return (
            item.keywords.includes(
              search
            ) ||
            item.emoji.includes(
              search
            )
          );
        }
      );

    if (!matches.length) {
      grid.innerHTML = `
        <div
          class="hopper-emoji-empty"
        >
          No matching emoji found.
          Try another word.
        </div>
      `;

      return;
    }

    grid.innerHTML =
      matches
        .map(
          item => `
            <button
              type="button"
              class="hopper-emoji-choice"
              data-hopper-emoji="${item.emoji}"
              title="${escapeHtml(
                item.keywords
              )}"
            >
              ${item.emoji}
            </button>
          `
        )
        .join("");
  }

  /* ============================================================
     ADD PICKER TO AVATAR FIELD
     ============================================================ */

  function installEmojiPicker() {
    const avatarInput =
      modalBody.querySelector(
        'input[name="avatar"]'
      );

    if (!avatarInput) {
      return;
    }

    if (
      modalBody.querySelector(
        ".hopper-emoji-picker-button"
      )
    ) {
      return;
    }

    const field =
      avatarInput.closest(
        ".field"
      );

    if (!field) {
      return;
    }

    const currentEmoji =
      avatarInput.value ||
      "✨";

    field.insertAdjacentHTML(
      "beforeend",
      `
        <button
          type="button"
          class="hopper-emoji-picker-button"
          data-hopper-emoji-action="toggle"
        >
          <span
            class="hopper-avatar-preview"
            data-hopper-avatar-preview
          >
            ${escapeHtml(
              currentEmoji
            )}
          </span>

          Choose Emoji
        </button>

        <div
          class="hopper-emoji-panel"
          data-hopper-emoji-panel
        >
          <div
            class="hopper-emoji-search-wrap"
          >
            <i
              class="
                fa-solid
                fa-magnifying-glass
                hopper-emoji-search-icon
              "
            ></i>

            <input
              type="search"
              class="hopper-emoji-search"
              placeholder="Search: skate, surf, food, dog..."
              autocomplete="off"
            />
          </div>

          <div
            class="hopper-emoji-grid"
          ></div>

          <div
            class="hopper-emoji-help"
          >
            You can also type or paste any emoji directly
            into the Avatar field.
          </div>
        </div>
      `
    );

    const panel =
      field.querySelector(
        "[data-hopper-emoji-panel]"
      );

    if (panel) {
      renderEmojiChoices(
        panel,
        ""
      );
    }
  }

  /* ============================================================
     ENHANCE ALL MODALS
     ============================================================ */

  const previousOpenModalEmojiPicker =
    openModal;

  openModal =
    function openModalWithEmojiPicker(
      options
    ) {
      previousOpenModalEmojiPicker(
        options
      );

      requestAnimationFrame(
        () => {
          installEmojiPicker();
        }
      );
    };

  /* ============================================================
     EVENTS
     ============================================================ */

  document.addEventListener(
    "click",
    event => {
      const toggle =
        event.target.closest(
          '[data-hopper-emoji-action="toggle"]'
        );

      if (toggle) {
        const field =
          toggle.closest(
            ".field"
          );

        const panel =
          field?.querySelector(
            "[data-hopper-emoji-panel]"
          );

        if (panel) {
          panel.classList.toggle(
            "open"
          );

          if (
            panel.classList.contains(
              "open"
            )
          ) {
            panel
              .querySelector(
                ".hopper-emoji-search"
              )
              ?.focus();
          }
        }

        return;
      }

      const choice =
        event.target.closest(
          "[data-hopper-emoji]"
        );

      if (!choice) {
        return;
      }

      const field =
        choice.closest(
          ".field"
        );

      const avatarInput =
        field?.querySelector(
          'input[name="avatar"]'
        );

      const preview =
        field?.querySelector(
          "[data-hopper-avatar-preview]"
        );

      const panel =
        field?.querySelector(
          "[data-hopper-emoji-panel]"
        );

      const emoji =
        choice.dataset
          .hopperEmoji;

      if (
        avatarInput &&
        emoji
      ) {
        avatarInput.value =
          emoji;

        avatarInput.dispatchEvent(
          new Event(
            "input",
            {
              bubbles: true
            }
          )
        );
      }

      if (preview) {
        preview.textContent =
          emoji;
      }

      panel?.classList.remove(
        "open"
      );
    }
  );

  document.addEventListener(
    "input",
    event => {
      if (
        event.target.matches(
          ".hopper-emoji-search"
        )
      ) {
        const panel =
          event.target.closest(
            "[data-hopper-emoji-panel]"
          );

        if (panel) {
          renderEmojiChoices(
            panel,
            event.target.value
          );
        }

        return;
      }

      if (
        event.target.matches(
          'input[name="avatar"]'
        )
      ) {
        const field =
          event.target.closest(
            ".field"
          );

        const preview =
          field?.querySelector(
            "[data-hopper-avatar-preview]"
          );

        if (preview) {
          preview.textContent =
            event.target.value ||
            "✨";
        }
      }
    }
  );

  /*
   * Handle an avatar form that might already
   * be open when this code loads.
   */
  installEmojiPicker();
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>

<style>

    display: inline-flex;

<script>
(() => {
  "use strict";

  const SHOP_HOPPER_SUPABASE_URL =
    "https://ulnwokjannqitxgxqkdu.supabase.co";
  const SHOP_HOPPER_SUPABASE_KEY =
    "sb_publishable_abcSfF1w9wRtRHwIVs5zUA_n-Ctn8i2";

  if (!window.supabase?.createClient) {
    console.error("Shop Hopper cloud client could not be loaded.");
    return;
  }

  const cloudClient = window.supabase.createClient(
    SHOP_HOPPER_SUPABASE_URL,
    SHOP_HOPPER_SUPABASE_KEY
  );

  let cloudReady = false;
  let cloudCanEdit = false;
  let cloudSyncing = false;
  let cloudReloadTimer = null;
  let cloudSyncTimer = null;
  let cloudKnownIds = null;

  const localSaveState = saveState;

  function ids(values) {
    return new Set((values || []).map(value => value.id));
  }

  function captureIds(source) {
    return {
      merchants: ids(source.merchants),
      stores: ids(source.stores),
      items: ids(source.items),
      hoppers: ids(source.hoppers),
      hopperLists: ids(source.hopperLists),
      hopperEntries: ids(
        (source.hopperLists || []).flatMap(list => list.entries || [])
      )
    };
  }

  function difference(before, after) {
    return [...(before || [])].filter(value => !(after || new Set()).has(value));
  }

  function setCloudStatus(message, mode = "") {
    const status = document.getElementById("cloudStatus");
    if (!status) return;
    status.className = `cloud-status ${mode}`.trim();
    status.querySelector("span:last-child").textContent = message;
  }

  const EDITOR_ONLY_SELECTOR = [
    '[data-persona-builder="add"]',
    '[data-hopper-manage="edit"]',
    '[data-hopper-manage="delete"]',
    '[data-hopper-nav="add"]',
    '[data-action="hopper-add-local-find"]',
    '[data-hopper-catalog-action="add"]',
    '[data-hopper-catalog-action="create"]',
    '[data-action="add-merchant"]',
    '[data-action="reset-demo"]',
    '[data-action="add-store"]',
    '[data-action="edit-store"]',
    '[data-action="toggle-store-publish"]',
    '[data-action="add-item"]',
    '[data-action="bulk-import"]',
    '[data-action="edit-item"]',
    '[data-action="toggle-item"]',
    '[data-action="delete-item"]',
    '[data-demo-data-action="import"]'
  ].join(',');

  const ACTION_LABELS = {
    "shopper-filter": "Filter products",
    "refresh-shopper": "Refresh products",
    "refresh-merchant": "Refresh merchant data",
    "merchant-exit": "Back to merchant list",
    "edit-store": "Edit store",
    "toggle-store-publish": "Change store publishing status",
    "edit-item": "Edit item",
    "toggle-item": "Change item publishing status",
    "delete-item": "Delete item",
    "hopper-open-item": "Open item details",
    "map-view-item": "Open map item"
  };

  function improveAccessibleNames(root = document) {
    root.querySelectorAll("i").forEach(icon => icon.setAttribute("aria-hidden", "true"));

    root.querySelectorAll("button, [role=button]").forEach(control => {
      if (control.getAttribute("aria-label")) return;
      const action = control.dataset?.action;
      const label = ACTION_LABELS[action] || control.title || control.textContent.trim();
      if (label) control.setAttribute("aria-label", label);
    });

    root.querySelectorAll(".leaflet-marker-icon:not([aria-label])").forEach(marker => {
      marker.setAttribute("aria-label", marker.title || "Map location");
    });
  }

  function organizeDemoBar() {
    const bar = document.querySelector(".demo-bar");
    if (!bar || bar.dataset.organized === "true") return;

    const label = bar.querySelector(".demo-label");
    const select = document.getElementById("personaSelect");
    const help = bar.querySelector(".prototype-help-button");
    const persona = bar.querySelector(".add-hopper-persona-button");
    const dataTools = document.getElementById("demoDataTools");
    const status = document.getElementById("cloudStatus");
    const auth = document.getElementById("cloudAuthButton");

    const primary = document.createElement("div");
    primary.className = "demo-primary-tools";
    [label, select, help].forEach(node => node && primary.appendChild(node));

    const menu = document.createElement("details");
    menu.className = "demo-tools-menu";
    const summary = document.createElement("summary");
    summary.textContent = "Tools";
    summary.setAttribute("aria-label", "Open Shop Hopper tools");
    const panel = document.createElement("div");
    panel.className = "demo-tools-panel";
    [persona, dataTools].forEach(node => node && panel.appendChild(node));
    menu.append(summary, panel);
    primary.appendChild(menu);

    const authTools = document.createElement("div");
    authTools.className = "demo-auth-tools";
    [status, auth].forEach(node => node && authTools.appendChild(node));

    bar.replaceChildren(primary, authTools);
    bar.dataset.organized = "true";
  }

  function applyEditorUI() {
    document.querySelectorAll(EDITOR_ONLY_SELECTOR).forEach(control => {
      control.dataset.editorOnly = "true";
      control.hidden = !cloudCanEdit;
      control.setAttribute("aria-hidden", String(!cloudCanEdit));
    });

    let notice = document.getElementById("readOnlyNotice");
    if (!notice) {
      notice = document.createElement("div");
      notice.id = "readOnlyNotice";
      notice.className = "read-only-notice";
      notice.setAttribute("role", "status");
      notice.textContent = "Viewing shared Shop Hopper data — sign in as an approved team member to make changes.";
      document.querySelector(".demo-bar")?.insertAdjacentElement("afterend", notice);
    }
    notice.hidden = cloudCanEdit;
    improveAccessibleNames();
  }

  function installEditorAwareRendering() {
    const originalRenderAll = renderAll;
    renderAll = function renderAllWithEditorState() {
      originalRenderAll();
      applyEditorUI();
    };

    document.addEventListener("click", event => {
      const control = event.target.closest(EDITOR_ONLY_SELECTOR);
      if (!control || cloudCanEdit) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      setCloudStatus("Sign in to make changes", "error");
    }, true);
  }

  function installCloudControls() {
    const bar = document.querySelector(".demo-bar");
    if (!bar || document.getElementById("cloudStatus")) return;

    const status = document.createElement("div");
    status.id = "cloudStatus";
    status.className = "cloud-status";
    status.innerHTML = '<span class="cloud-status-dot"></span><span>Connecting…</span>';

    const auth = document.createElement("button");
    auth.id = "cloudAuthButton";
    auth.type = "button";
    auth.className = "cloud-auth-button";
    auth.textContent = "Team sign in";
    auth.addEventListener("click", handleAuthClick);

    bar.append(status, auth);
    organizeDemoBar();
    improveAccessibleNames(bar);
  }

  async function refreshEditorStatus() {
    const { data: { session } } = await cloudClient.auth.getSession();
    const button = document.getElementById("cloudAuthButton");

    if (!session) {
      cloudCanEdit = false;
      if (button) button.textContent = "Team sign in";
      applyEditorUI();
      return;
    }

    const { data, error } = await cloudClient
      .from("app_editors")
      .select("user_id")
      .eq("user_id", session.user.id)
      .maybeSingle();

    cloudCanEdit = !error && Boolean(data);
    if (button) button.textContent = cloudCanEdit ? "Editor signed in" : "Sign out";
    applyEditorUI();
  }

  async function handleAuthClick() {
    const { data: { session } } = await cloudClient.auth.getSession();

    if (session) {
      await cloudClient.auth.signOut();
      cloudCanEdit = false;
      document.getElementById("cloudAuthButton").textContent = "Team sign in";
      setCloudStatus("Shared data · view only", "connected");
      applyEditorUI();
      return;
    }

    const email = window.prompt("Enter your approved Shop Hopper team email:");
    if (!email) return;

    const { error } = await cloudClient.auth.signInWithOtp({
      email: email.trim(),
      options: {
        emailRedirectTo: new URL(".", window.location.href).href,
        shouldCreateUser: true
      }
    });

    if (error) {
      window.alert(`Could not send the sign-in email: ${error.message}`);
      return;
    }

    window.alert("Check your email for the Shop Hopper sign-in link.");
  }

  function mapCloudState(results) {
    const [merchants, stores, items, hoppers, lists, entries, settings] = results;
    const entriesByList = new Map();

    (entries.data || []).forEach(row => {
      if (!entriesByList.has(row.hopper_list_id)) entriesByList.set(row.hopper_list_id, []);
      entriesByList.get(row.hopper_list_id).push({
        id: row.id,
        itemId: row.item_id,
        merchantId: row.merchant_id,
        itemName: row.item_name,
        merchantName: row.merchant_name,
        suggestedCategory: row.suggested_category,
        note: row.note
      });
    });

    return {
      userLocation:
        (settings.data || []).find(row => row.key === "default_location")?.value ||
        state.userLocation,
      merchants: (merchants.data || []).map(row => ({
        id: row.id,
        businessName: row.business_name,
        ownerName: row.owner_name,
        email: row.email,
        phone: row.phone,
        status: row.status
      })),
      stores: (stores.data || []).map(row => ({
        id: row.id,
        merchantId: row.merchant_id,
        name: row.name,
        description: row.description,
        address: row.address,
        marketplaceSlug: row.marketplace_slug,
        category: row.category,
        lat: row.lat,
        lng: row.lng,
        published: row.published
      })),
      items: (items.data || []).map(row => ({
        id: row.id,
        storeId: row.store_id,
        title: row.title,
        description: row.description,
        category: row.category,
        type: row.item_type,
        priceCents: row.price_cents,
        qty: row.qty,
        image: row.image_url,
        featured: row.featured,
        active: row.active,
        createdByHopperId: row.created_by_hopper_id
      })),
      hoppers: (hoppers.data || []).map(row => ({
        id: row.id,
        name: row.display_name,
        personaName: row.persona_name,
        avatar: row.avatar,
        location: row.location,
        marketplaceSlug: row.marketplace_slug,
        marketplaceName: row.marketplace_name,
        interests: row.interests || [],
        active: row.active
      })),
      hopperLists: (lists.data || []).map(row => ({
        id: row.id,
        hopperId: row.hopper_id,
        title: row.title,
        description: row.description,
        entries: entriesByList.get(row.id) || []
      }))
    };
  }

  async function loadCloudState({ quiet = false } = {}) {
    if (!quiet) setCloudStatus("Loading shared data…");

    const results = await Promise.all([
      cloudClient.from("merchants").select("*").order("business_name"),
      cloudClient.from("stores").select("*").order("name"),
      cloudClient.from("items").select("*").order("title"),
      cloudClient.from("hoppers").select("*").order("display_name"),
      cloudClient.from("hopper_lists").select("*").order("title"),
      cloudClient.from("hopper_list_entries").select("*").order("sort_order"),
      cloudClient.from("app_settings").select("*")
    ]);

    const failure = results.find(result => result.error);
    if (failure) {
      setCloudStatus("Offline · local copy", "error");
      console.error("Could not load Shop Hopper shared data.", failure.error);
      return false;
    }

    state = mapCloudState(results);
    cloudKnownIds = captureIds(state);
    localSaveState();
    renderAll();
    cloudReady = true;
    setCloudStatus(
      cloudCanEdit ? "Shared data · editor" : "Shared data · view only",
      "connected"
    );
    return true;
  }

  async function syncCloudState() {
    if (!cloudReady || !cloudCanEdit || cloudSyncing) return;
    cloudSyncing = true;
    setCloudStatus("Saving shared update…");

    try {
      const currentIds = captureIds(state);
      const removals = [
        ...difference(cloudKnownIds?.hopperEntries, currentIds.hopperEntries).map(id => ({ table: "hopper_list_entries", id })),
        ...difference(cloudKnownIds?.hopperLists, currentIds.hopperLists).map(id => ({ table: "hopper_lists", id })),
        ...difference(cloudKnownIds?.items, currentIds.items).map(id => ({ table: "items", id })),
        ...difference(cloudKnownIds?.stores, currentIds.stores).map(id => ({ table: "stores", id })),
        ...difference(cloudKnownIds?.merchants, currentIds.merchants).map(id => ({ table: "merchants", id })),
        ...difference(cloudKnownIds?.hoppers, currentIds.hoppers).map(id => ({ table: "hoppers", id }))
      ];

      /*
       * The database validates this explicit ID list and performs the
       * deletions plus the upserts in one transaction. This supports
       * Hopper cascades and Import Data reconciliation without granting
       * TRUNCATE or allowing an unrestricted table clear.
       */
      const { error } = await cloudClient.rpc("sync_app_state", {
        payload: state,
        removals
      });
      if (error) throw error;

      cloudKnownIds = currentIds;
      setCloudStatus("Shared update saved", "connected");
    } catch (error) {
      console.error("Shared update failed.", error);
      setCloudStatus("Update not saved", "error");
      window.alert(error.message || "The shared update could not be saved.");
      await loadCloudState({ quiet: true });
    } finally {
      cloudSyncing = false;
    }
  }

  saveState = function saveSharedState() {
    localSaveState();
    if (!cloudReady) return;

    if (!cloudCanEdit) {
      setCloudStatus("Sign in to make changes", "error");
      window.clearTimeout(cloudReloadTimer);
      cloudReloadTimer = window.setTimeout(() => loadCloudState({ quiet: true }), 250);
      return;
    }

    window.clearTimeout(cloudSyncTimer);
    cloudSyncTimer = window.setTimeout(syncCloudState, 250);
  };

  function scheduleCloudReload() {
    if (cloudSyncing) return;
    window.clearTimeout(cloudReloadTimer);
    cloudReloadTimer = window.setTimeout(() => loadCloudState({ quiet: true }), 350);
  }

  function subscribeToCloudChanges() {
    const channel = cloudClient.channel("shop-hopper-shared-data");
    ["merchants", "stores", "items", "hoppers", "hopper_lists", "hopper_list_entries", "app_settings"]
      .forEach(table => {
        channel.on(
          "postgres_changes",
          { event: "*", schema: "public", table },
          scheduleCloudReload
        );
      });
    channel.subscribe();
  }

  cloudClient.auth.onAuthStateChange(async () => {
    await refreshEditorStatus();
    if (cloudReady) {
      setCloudStatus(
        cloudCanEdit ? "Shared data · editor" : "Shared data · view only",
        "connected"
      );
    }
  });

  async function initializeCloud() {
    installCloudControls();
    installEditorAwareRendering();
    applyEditorUI();
    await refreshEditorStatus();
    await loadCloudState();
    subscribeToCloudChanges();
  }

  initializeCloud();
})();
</script>
