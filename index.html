<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' https://ulnwokjannqitxgxqkdu.supabase.co wss://ulnwokjannqitxgxqkdu.supabase.co https://nominatim.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
  />
<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Shop Hopper — Pacific Beach Prototype</title>

  <!-- Leaflet fallback map -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Font Awesome for icons similar to the real app -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />

  <link rel="stylesheet" href="assets/app.css" />

  <!-- Mobile modal visibility fix: keep dialogs above the fixed bottom navigation. -->
  </head>
<body>
  <div class="prototype-shell">

    <div class="demo-bar">
      <div class="demo-label">
        <span class="demo-dot"></span>
        Prototype Persona
      </div>

      <select
        id="personaSelect"
        class="persona-select"
        aria-label="Prototype persona"
      ></select>
    </div>

    <main id="app"></main>

  </div>

  <!-- ============================================================
       MODAL
       ============================================================ -->

  <div
    id="modalBackdrop"
    class="modal-backdrop"
    aria-hidden="true"
  >
    <form
      id="modalForm"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      tabindex="-1"
    >
      <div class="modal-header">
        <h2 id="modalTitle">Modal</h2>

        <button
          type="button"
          class="modal-close"
          data-action="close-modal"
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <div
        id="modalBody"
        class="modal-body"
      ></div>

      <div
        id="modalFooter"
        class="modal-footer"
      >
        <button
          type="button"
          class="button button-secondary"
          data-action="close-modal"
        >
          Cancel
        </button>

        <button
          id="modalSubmit"
          type="submit"
          class="button button-primary"
        >
          Save
        </button>
      </div>
    </form>
  </div>

  <div
    id="appLiveStatus"
    class="sr-only"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <!-- Leaflet fallback -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="assets/app-core.js"></script>
  <script src="assets/hopper-data.js"></script>
  <script src="assets/map-inventory.js"></script>
  <script src="assets/hopper-navigation.js"></script>
  <script src="assets/surfer-list.js"></script>
  <script src="assets/item-details.js"></script>
  <script src="assets/catalog-interactions.js"></script>
  <script src="assets/backup-status.js"></script>
  <script src="assets/persona-builder.js"></script>
  <script src="assets/persona-management.js"></script>
  <script src="assets/catalog-picker.js"></script>
  <script src="assets/emoji-picker.js"></script>
  <script src="assets/help-accessibility.js"></script>

     ============================================================ -->

<!-- ============================================================

     ============================================================ -->

<!-- ============================================================

     ============================================================ -->

<!-- ============================================================

     ============================================================ -->

     ============================================================ -->

     ============================================================ -->

</body>
</html>
